<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startwith</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f2;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .form {
      display: none;
      margin-top: 25px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .back {
      background: #eee;
      color: #222;
    }

    #registerMessage,
    #loginMessage {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Startwith</h1>
  <div class="subtitle">Sağlıklı kahvaltı kapınızda</div>

  <div id="home">
    <button onclick="showRegister()">Üye Ol</button>
    <button class="secondary" onclick="showLogin()">Giriş Yap</button>
  </div>

  <div id="registerForm" class="form">

    <h2>Üye Ol</h2>

    <input id="firstName" type="text" placeholder="Ad">
    <input id="lastName" type="text" placeholder="Soyad">
    <input id="phone" type="tel" placeholder="Telefon">
    <input id="email" type="email" placeholder="E-posta">

    <select id="neighborhood">
      <option value="">Mahalle seçin</option>
      <option value="Batıkent Mahallesi">Batıkent Mahallesi</option>
      <option value="Çamlıca Mahallesi">Çamlıca Mahallesi</option>
    </select>

    <input id="address" type="text" placeholder="Adres">
    <input id="password" type="password" placeholder="Şifre">

    <button onclick="register()">Kayıt Ol</button>
    <button class="back" onclick="goHome()">Geri</button>

    <p id="registerMessage"></p>
  </div>

  <div id="loginForm" class="form">

    <h2>Giriş Yap</h2>

    <input id="loginEmail" type="email" placeholder="E-posta">
    <input id="loginPassword" type="password" placeholder="Şifre">

    <button onclick="login()">Giriş Yap</button>
    <button class="back" onclick="goHome()">Geri</button>

    <p id="loginMessage"></p>
  </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jwwfwlddmordfudorrla.supabase.co";
const SUPABASE_KEY = "sb_publishable_-6qXohZul38YL1S4DyfiPA_cg7iHPgO";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function showRegister() {
  document.getElementById("home").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("registerForm").style.display = "block";
}

function showLogin() {
  document.getElementById("home").style.display = "none";
  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
}

function goHome() {
  document.getElementById("home").style.display = "block";
  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
}

async function register() {

  const firstName = document.getElementById("firstName").value;
  const lastName = document.getElementById("lastName").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const neighborhood = document.getElementById("neighborhood").value;
  const address = document.getElementById("address").value;
  const password = document.getElementById("password").value;

  const message = document.getElementById("registerMessage");

  if (!firstName || !lastName || !phone || !email || !neighborhood || !address || !password) {
    message.innerText = "Lütfen tüm alanları doldurun.";
    return;
  }

  message.innerText = "Kayıt yapılıyor...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        first_name: firstName,
        last_name: lastName,
        phone: phone,
        neighborhood: neighborhood,
        address: address
      }
    }
  });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText = "Kayıt başarılı! E-posta adresinizi kontrol edin.";
}

async function login() {

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const message = document.getElementById("loginMessage");

  message.innerText = "Giriş yapılıyor...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText = "Giriş başarılı!";
}

</script>

</body>
</html>
