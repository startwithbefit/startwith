<script>

const SUPABASE_URL = "https://jwwfwlddmordfudorrla.supabase.co";
const SUPABASE_KEY = "sb_publishable_-6qXohZul38YL1S4DyfiPA_cg7iHPgO";

const supabaseClient = supabase.createClient(

);

const STARTWITH_CART_KEY = "startwithCartV1";
let cart = [];
try {

let introVideoIndex = 0;


/* =====================================================
   START WITH - VIDEO AÇILIŞ EKRANI
===================================================== */

function createStartwithIntro() {

  if (document.getElementById("startwithIntro")) {
    return;
  }

  const style = document.createElement("style");

  style.innerHTML = `
    #startwithIntro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      z-index: 999999;
      cursor: pointer;
    }

    #startwithIntro .intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(42%) saturate(70%) contrast(90%);
      transition: opacity 1.2s ease;
    }

    #startwithIntro .intro-video.active {
      opacity: 1;
    }

    #startwithIntro .intro-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.22);
      z-index: 2;
    }

    #startwithIntro .intro-title {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(34px,8vw,72px);
      font-weight: 700;

      letter-spacing: 2px;

      text-align: center;
      text-transform: uppercase;

      text-shadow:
        0 2px 18px rgba(0,0,0,.35);

      user-select: none;
      flex-direction: column;
      line-height: 1.05;
    }

    #startwithIntro .intro-title span {
      display: block;
      white-space: nowrap;
    }

    #startwithIntro .intro-order-button {
      position: absolute;
      left: 50%;
      bottom: max(42px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 4;
      width: min(82vw, 320px);
      padding: 15px 24px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      background: rgba(0,0,0,.30);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #startwithIntro.fade-out {
      opacity: 0;
      transition: opacity .55s ease;
      pointer-events: none;
    }
  `;

  document.head.appendChild(style);


  const intro =
    document.createElement("div");

  intro.id = "startwithIntro";


  intro.innerHTML = `

    <video
      class="intro-video active"
      muted
      playsinline
      preload="auto"
    >
      <source
        src="video03.mp4"
        type="video/mp4"
      >
    </video>


    <video
      class="intro-video"
      muted
      playsinline
      preload="auto"
    >
      <source
        src="video02.mp4"
        type="video/mp4"
      >
    </video>


    <video
      class="intro-video"
      muted
      playsinline
      preload="auto"
    >
      <source
        src="video01.mp4"
        type="video/mp4"
      >
    </video>


    <div class="intro-overlay"></div>


    <div class="intro-title">
      <span>START WITH.</span>
      <span>BE FIT.</span>
    </div>

    <button class="intro-order-button" type="button">SİPARİŞ VER</button>

  `;


  document.body.appendChild(intro);


  const videos =
    intro.querySelectorAll(
      ".intro-video"
    );


  function playIntroVideo(index) {

    videos.forEach(
      (video, i) => {

        if (i === index) {

          video.classList.add(
            "active"
          );

          try {
            video.currentTime = 0;
          } catch (e) {}

          video
            .play()
            .catch(() => {});

        } else {

          video.classList.remove(
            "active"
          );

          video.pause();

          try {
            video.currentTime = 0;
          } catch (e) {}

        }

      }
    );

  }


  videos.forEach(
    (video, index) => {

      video.addEventListener(
        "ended",
        () => {

          introVideoIndex =
            (index + 1) %
            videos.length;

          playIntroVideo(
            introVideoIndex
          );

        }
      );

    }
  );


  function closeIntro() {

    intro.classList.add(
      "fade-out"
    );


    videos.forEach(
      video => {
        video.pause();
      }
    );


    setTimeout(
      () => {

        intro.remove();

      },
      600
    );

  }


  const orderButton =
    intro.querySelector(
      ".intro-order-button"
    );

  orderButton.addEventListener(
    "click",
    event => {
      event.stopPropagation();
      closeIntro();
      openStartwithAfterIntro();
    }
  );


  playIntroVideo(0);

}


function isPasswordRecoveryLink() {
  const hash = window.location.hash || "";
  const search = window.location.search || "";
  return (
    hash.includes("type=recovery") ||
    search.includes("type=recovery") ||
    hash.includes("access_token=") ||
    search.includes("code=")
  );
}

async function initializeStartwith() {
  // Şifre sıfırlama bağlantısından gelindiyse açılış videosunu göstermeden
  // Supabase oturumunu işle ve doğrudan yeni şifre ekranını aç.
  if (isPasswordRecoveryLink()) {
    const intro = document.getElementById("startwithIntro");
    if (intro) intro.remove();

    // PKCE akışında URL'deki code'u oturuma çevir.
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (code) {
      await supabaseClient.auth.exchangeCodeForSession(code);
    }

    // Hash tabanlı akışta Supabase istemcisinin URL oturumunu işlemesine kısa süre tanı.
    await new Promise(resolve => setTimeout(resolve, 350));
    showNewPasswordForm();
    return;
  }

  createStartwithIntro();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializeStartwith);
} else {
  initializeStartwith();
}


/* =====================================================
   OTURUM / BENİ HATIRLA
===================================================== */

async function openStartwithAfterIntro() {
  const { data } = await supabaseClient.auth.getSession();

  if (data?.session) {
    showHome();
  } else {
    showLogin();
  }
}

function fillRememberedEmail() {
  const emailInput = document.getElementById("loginEmail");
  const rememberInput = document.getElementById("rememberMe");
  if (!emailInput || !rememberInput) return;

  const savedEmail = localStorage.getItem("startwithRememberedEmail");
  if (savedEmail) {
    emailInput.value = savedEmail;
    rememberInput.checked = true;
  }
}

/* =====================================================
   KAYIT / GİRİŞ EKRANLARI
===================================================== */

function showRegister() {

  document
    .getElementById("home")
    .style.display = "none";

  document
    .getElementById("loginForm")
    .style.display = "none";

  document
    .getElementById("registerForm")
    .style.display = "block";
}


function showLogin() {

  document
    .getElementById("home")
    .style.display = "none";

  document
    .getElementById("registerForm")
    .style.display = "none";

  document
    .getElementById("loginForm")
    .style.display = "block";

  fillRememberedEmail();
}


function goHome() {

  document
    .getElementById("home")
    .style.display = "block";

  document
    .getElementById("registerForm")
    .style.display = "none";

  document
    .getElementById("loginForm")
    .style.display = "none";
}


/* =====================================================
   KAYIT
===================================================== */

async function register() {

  const firstName =
    document
      .getElementById("firstName")
      .value
      .trim();

  const lastName =
    document
      .getElementById("lastName")
      .value
      .trim();

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim();
const password =
    document
      .getElementById("password")
      .value;


  const message =
    document.getElementById(
      "registerMessage"
    );


  if (
    !firstName ||
    !lastName ||
    !phone ||
    !email ||
    !password ||
    !passwordAgain
  ) {

    message.innerText =
      "Lütfen tüm alanları doldurun.";

    return;
  }


  if (password !== passwordAgain) {

    message.innerText =
      "Şifreler uyuşmuyor. Lütfen iki şifreyi de aynı girin.";

    return;
  }


  message.innerText =
    "Kayıt yapılıyor...";


  const { error } =
    await supabaseClient
      .auth
      .signUp({

        email: email,

        password: password,

        options: {

          data: {

            last_name: lastName,
            phone: phone

    message.innerText =

  message.innerText =

async function sendPasswordReset() {

  const message = document.getElementById("resetMessage");

  if (!email) {
    message.innerText = "Lütfen e-posta adresinizi girin.";
    return;
  }

  message.innerText = "Bağlantı gönderiliyor...";

  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText = "Şifre yenileme bağlantısı gönderildi. Lütfen e-posta kutunuzu kontrol edin.";

function showNewPasswordForm() {
  const intro = document.getElementById("startwithIntro");
  if (intro) intro.remove();

  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "none";

  document.getElementById("home").innerHTML = `

    <p style="text-align:center;color:#667064;margin-bottom:18px;">Yeni şifrenizi aşağıya girin.</p>
    <input id="newPassword" type="password" placeholder="Yeni şifre">
    <input id="newPasswordAgain" type="password" placeholder="Yeni şifre tekrar">
    <button onclick="saveNewPassword()">Şifremi Yenile</button>
    <p id="newPasswordMessage" style="text-align:center;"></p>
  `;
}

async function saveNewPassword() {
  const password = document.getElementById("newPassword")?.value || "";
  const passwordAgain = document.getElementById("newPasswordAgain")?.value || "";
  const message = document.getElementById("newPasswordMessage");

  if (password.length < 6) {
    message.innerText = "Şifreniz en az 6 karakter olmalıdır.";
    return;
  }

  if (password !== passwordAgain) {
    message.innerText = "Girdiğiniz şifreler aynı değil.";
    return;
  }

  message.innerText = "Şifreniz yenileniyor...";
  const { error } = await supabaseClient.auth.updateUser({ password });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText = "Şifreniz başarıyla yenilendi. Giriş ekranına yönlendiriliyorsunuz...";
  await supabaseClient.auth.signOut();
  setTimeout(() => showLogin(), 1200);
}

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    setTimeout(() => showNewPasswordForm(), 0);

});

async function ensureInitialAddress(user) {
  const { data: existing, error } = await supabaseClient
    .from("customer_addresses")
    .select("id")
    .eq("user_id", user.id)
    .limit(1);

  if (error || (existing && existing.length > 0)) return;

  const neighborhood = user.user_metadata?.neighborhood;
  const address = user.user_metadata?.address;

  if (neighborhood && address && ["Batıkent", "Çamlıca"].includes(neighborhood)) {
    await supabaseClient.from("customer_addresses").insert([{
      user_id: user.id,
      title: "Ev",
      neighborhood,
      address,
      is_default: true
    }]);
  }
}

async function showProfile() {
  const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
  if (userError || !user) { showLogin(); return; }

  await ensureInitialAddress(user);

  const { data: addresses, error } = await supabaseClient
    .from("customer_addresses")
    .select("*")
    .eq("user_id", user.id)
    .order("is_default", { ascending: false })
    .order("created_at", { ascending: true });

  let addressHtml = "";
  if (error) {
    addressHtml = `<p>Adresler yüklenemedi: ${escapeHtml(error.message)}</p>`;
  } else if (!addresses || addresses.length === 0) {
    addressHtml = `<p>Henüz kayıtlı adresiniz yok.</p>`;
  } else {
    addressHtml = addresses.map(a => `
      <div style="background:#fff;padding:14px;border-radius:14px;margin:10px 0;border:1px solid #e6e0d5;">
        <strong>${escapeHtml(a.title)}${a.is_default ? " · Varsayılan" : ""}</strong>
        <p style="margin:7px 0;">${escapeHtml(a.neighborhood)} · ${escapeHtml(a.address)}</p>
        <button class="secondary" onclick="showAddressForm('${a.id}')">Düzenle</button>
        ${!a.is_default ? `<button class="secondary" onclick="setDefaultAddress('${a.id}')">Varsayılan Yap</button>` : ""}
        <button class="back" onclick="deleteAddress('${a.id}')">Sil</button>
      </div>
    `).join("");
  }

  document.getElementById("home").innerHTML = `
    <h2>Profilim</h2>
    <div style="background:#fff;padding:16px;border-radius:14px;margin-bottom:16px;">
      <label>Ad</label>
      <input id="profileFirstName" value="${escapeHtml(user.user_metadata?.first_name || "")}">
      <label>Soyad</label>
      <input id="profileLastName" value="${escapeHtml(user.user_metadata?.last_name || "")}">
      <label>Telefon</label>
      <input id="profilePhone" value="${escapeHtml(user.user_metadata?.phone || "")}">
      <label>E-posta</label>
      <input value="${escapeHtml(user.email || "")}" disabled>
      <button onclick="saveProfile()">Kişisel Bilgileri Kaydet</button>
      <p id="profileMessage" style="text-align:center;"></p>
    </div>

    <h3>Adreslerim</h3>
    ${addressHtml}
    <button onclick="showAddressForm()">+ Yeni Adres Ekle</button>
    <button class="back" onclick="showHome()">Ana Sayfa</button>
  `;
}

async function saveProfile() {
  const message = document.getElementById("profileMessage");
  const firstName = document.getElementById("profileFirstName").value.trim();
  const lastName = document.getElementById("profileLastName").value.trim();
  const phone = document.getElementById("profilePhone").value.trim();
  if (!firstName || !lastName || !phone) {
    message.innerText = "Lütfen ad, soyad ve telefon alanlarını doldurun.";
    return;
  }
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { error } = await supabaseClient.auth.updateUser({
    data: { ...(user?.user_metadata || {}), first_name: firstName, last_name: lastName, phone }
  });
  message.innerText = error ? "Bilgiler kaydedilemedi: " + error.message : "Bilgileriniz kaydedildi. ✓";
}

async function saveAddress(addressId = null) {
  const message = document.getElementById("addressMessage");
  const title = document.getElementById("addressTitle").value.trim();
  const neighborhood = document.getElementById("addressNeighborhood").value;
  const address = document.getElementById("addressText").value.trim();
  const wantsDefault = document.getElementById("addressDefault").checked;
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user || !title || !neighborhood || !address) {
    message.innerText = "Lütfen tüm adres alanlarını doldurun.";
    return;
  }
  if (!["Batıkent", "Çamlıca"].includes(neighborhood)) {
    message.innerText = "Şimdilik yalnızca Batıkent ve Çamlıca mahallelerine teslimat yapıyoruz.";
    return;
  }

  let makeDefault = wantsDefault;
  if (!addressId) {
    const { count } = await supabaseClient.from("customer_addresses")
      .select("id", { count: "exact", head: true }).eq("user_id", user.id);
    if ((count || 0) === 0) makeDefault = true;
  }

  if (makeDefault) {
    const { error: unsetError } = await supabaseClient.from("customer_addresses")
      .update({ is_default: false }).eq("user_id", user.id);
    if (unsetError) { message.innerText = "Adres kaydedilemedi: " + unsetError.message; return; }
  }

  let result;
  if (addressId) {
    result = await supabaseClient.from("customer_addresses")
      .update({ title, neighborhood, address, is_default: makeDefault })
      .eq("id", addressId).eq("user_id", user.id);
  } else {
    result = await supabaseClient.from("customer_addresses")
      .insert([{ user_id: user.id, title, neighborhood, address, is_default: makeDefault }]);
  }

  if (result.error) { message.innerText = "Adres kaydedilemedi: " + result.error.message; return; }
  await showProfile();
}

async function setDefaultAddress(addressId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  const { error: unsetError } = await supabaseClient.from("customer_addresses")
    .update({ is_default: false }).eq("user_id", user.id);
  if (unsetError) { alert("Adres güncellenemedi: " + unsetError.message); return; }
  const { error } = await supabaseClient.from("customer_addresses")
    .update({ is_default: true }).eq("id", addressId).eq("user_id", user.id);
  if (error) alert("Adres güncellenemedi: " + error.message);
  else showProfile();
}

async function deleteAddress(addressId) {
  if (!confirm("Bu adresi silmek istediğinize emin misiniz?")) return;
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { data: target } = await supabaseClient.from("customer_addresses")
    .select("is_default").eq("id", addressId).eq("user_id", user.id).single();
  const { error } = await supabaseClient.from("customer_addresses")
    .delete().eq("id", addressId).eq("user_id", user.id);
  if (error) { alert("Adres silinemedi: " + error.message); return; }

  if (target?.is_default) {
    const { data: remaining } = await supabaseClient.from("customer_addresses")
      .select("id").eq("user_id", user.id).order("created_at", { ascending: true }).limit(1);
    if (remaining?.[0]) await supabaseClient.from("customer_addresses")
      .update({ is_default: true }).eq("id", remaining[0].id).eq("user_id", user.id);
  }
  showProfile();
}

async function loadCheckoutAddresses() {
  const select = document.getElementById("deliveryAddress");
  const info = document.getElementById("deliveryAddressInfo");
  if (!select) return;
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  await ensureInitialAddress(user);
  const { data: addresses, error } = await supabaseClient.from("customer_addresses")
    .select("*").eq("user_id", user.id).order("is_default", { ascending: false }).order("created_at", { ascending: true });
  if (error) {
    select.innerHTML = `<option value="">Adresler yüklenemedi</option>`;
    if (info) info.innerText = error.message;
    return;
  }
  if (!addresses || addresses.length === 0) {
    select.innerHTML = `<option value="">Önce profilinizden adres ekleyin</option>`;
    if (info) info.innerHTML = `Kayıtlı adresiniz bulunmuyor. <button class="secondary" onclick="showProfile()">Profilime Git</button>`;
    return;
  }
  select.innerHTML = addresses.map(a => `<option value="${a.id}" ${a.is_default ? "selected" : ""}>${escapeHtml(a.title)} · ${escapeHtml(a.neighborhood)} · ${escapeHtml(a.address)}</option>`).join("");
  if (info) info.innerText = "Siparişiniz seçtiğiniz adrese teslim edilecektir.";
}

function addProductToCart(
  name,
  price
) {

  const quantity =
    Number(

      document
        .getElementById(
          "productQuantity"
        )
        .value

    );


  const stockCode = STARTWITH_STOCK_PRODUCTS[name];

  if (stockCode) {
    const remaining = Number(STARTWITH_CURRENT_PRODUCT_STOCK[stockCode]);
    const alreadyInCart = cart
      .filter(item => STARTWITH_STOCK_PRODUCTS[item.name] === stockCode)
      .reduce((sum, item) => sum + Number(item.quantity || 0), 0);

    if (Number.isFinite(remaining) && alreadyInCart + quantity > remaining) {
      alert(`Bu üründen yalnızca ${remaining} adet kaldı. Sepetinizde ${alreadyInCart} adet var.`);
      return;
    }
  }


  const existingItem =
    cart.find(

      item =>
        item.name === name

    );


  if (existingItem) {

    existingItem.quantity +=
      quantity;

  } else {

    cart.push({

      name: name,
      price: price,
      quantity: quantity

    });

  }


  saveCart();
  showMenu();

}

function increaseQuantity(
  index
) {

  const item = cart[index];
  const stockCode = item ? STARTWITH_STOCK_PRODUCTS[item.name] : null;

  if (stockCode) {
    const remaining = Number(STARTWITH_CURRENT_PRODUCT_STOCK[stockCode]);
    const currentInCart = cart
      .filter(x => STARTWITH_STOCK_PRODUCTS[x.name] === stockCode)
      .reduce((sum, x) => sum + Number(x.quantity || 0), 0);

    if (Number.isFinite(remaining) && currentInCart >= remaining) {
      alert(`Bu üründen yalnızca ${remaining} adet kaldı. Daha fazla ekleyemezsiniz.`);
      return;
    }
  }

  cart[index].quantity++;

  saveCart();
  showCart();


  setTimeout(loadMenuProductStock, 0);
}


function decreaseQuantity(
  index
) {

  if (
    cart[index].quantity > 1
  ) {

    cart[index].quantity--;

  } else {

    cart.splice(
      index,
      1
    );

  }


  saveCart();
  showCart();

}


function removeFromCart(
  index
) {

  cart.splice(
    index,
    1
  );

  saveCart();
  showCart();

}

function getTomorrowDate() {

  const tomorrow =
    new Date();


  tomorrow.setDate(

    tomorrow.getDate() + 1

  );


  const year =
    tomorrow.getFullYear();


  const month =
    String(

      tomorrow.getMonth() + 1

    ).padStart(
      2,
      "0"
    );


  const day =
    String(

      tomorrow.getDate()

    ).padStart(
      2,
      "0"
    );


  return (
    `${year}-${month}-${day}`
  );

}



function formatLocalDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function getMinimumOrderDate() {
  const date = new Date();
  // 19:00'dan önce en erken yarın, 19:00 ve sonrasında en erken öbür gün.
  date.setDate(date.getDate() + (date.getHours() >= 19 ? 2 : 1));
  return formatLocalDate(date);
}

let STARTWITH_CURRENT_PRODUCT_STOCK = {};

async function loadMenuProductStock() {
  const stockDate = getMinimumDeliveryDate();
  const { data, error } = await supabaseClient.rpc("get_daily_product_stock", {
    p_stock_date: stockDate
  });

  if (error) {
    document.querySelectorAll("[data-stock-code]").forEach(el => {
      el.textContent = "Kontenjan alınamadı";
    });
    console.error("Ürün kontenjanı hatası:", error);
    return;
  }

  const remainingByCode = {};
  (data || []).forEach(row => {
    remainingByCode[row.product_code] = Number(row.remaining);
  });
  STARTWITH_CURRENT_PRODUCT_STOCK = remainingByCode;

  document.querySelectorAll("[data-stock-code]").forEach(el => {
    const code = el.getAttribute("data-stock-code");
    const remaining = remainingByCode[code];
    if (remaining === undefined) return;

    el.innerHTML = remaining > 0
      ? `Son ${remaining} adet`
      : "Tükendi";

    el.style.fontWeight = "800";
    if (remaining <= 0) el.style.color = "#a33";
  });
}

const STARTWITH_DELIVERY_SLOTS = [
  "07:00-08:00",
  "08:00-09:00",
  "09:00-10:00",
  "10:00-11:00",
  "11:00-12:00"

async function loadSlotAvailability() {
  const dateInput = document.getElementById("deliveryDate");
  const select = document.getElementById("deliverySlot");
  const info = document.getElementById("slotAvailabilityInfo");
  if (!dateInput || !select || !info) return;

  const selectedDate = dateInput.value;
  select.innerHTML = `<option value="">Saatler kontrol ediliyor...</option>`;
  select.disabled = true;

  const { data: availability, error } = await supabaseClient
    .rpc("get_delivery_slot_availability", { p_slot_date: selectedDate });

  if (error) {
    select.innerHTML = `<option value="">Saatler yüklenemedi</option>`;
    info.innerText = "Teslimat saatlerinin doluluk bilgisi alınamadı: " + error.message;
    return;
  }

  const remainingBySlot = {};
  (availability || []).forEach(row => {
    remainingBySlot[row.delivery_slot] = Number(row.remaining);
  });

  let options = `<option value="">Teslimat saati seçin</option>`;
  STARTWITH_DELIVERY_SLOTS.forEach(slot => {
    const remaining = remainingBySlot[slot] ?? 6;
    const full = remaining <= 0;
    const label = full
      ? `${slot.replace("-", " - ")} — DOLU`
      : `${slot.replace("-", " - ")} — ${remaining} kontenjan kaldı`;
    options += `<option value="${slot}" ${full ? "disabled" : ""}>${label}</option>`;
  });

  select.innerHTML = options;
  select.disabled = false;
  info.innerHTML = `Seçtiğiniz tarih için <strong>kalan kontenjan</strong> gösteriliyor. Dolu saatler seçilemez.`;
}

async function createOrder() {

  const slot =
    document
      .getElementById(
        "deliverySlot"
      )
      .value;


  const selectedDate =
    document
      .getElementById(
        "deliveryDate"
      )
      .value;


  const message =
    document
      .getElementById(
        "orderMessage"
      );


  const orderNote = (document.getElementById("orderNote")?.value || "").trim();
  const selectedAddressId = document.getElementById("deliveryAddress")?.value || "";

  const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

  if (cartTotal < 200) {
    message.innerText = "Minimum sepet tutarı 200 TL'dir. Siparişinizi tamamlamak için sepetinize ürün ekleyin.";
    return;
  }

  if (!slot) {

    message.innerText =
      "Lütfen teslimat saati seçin.";

    return;

  }


  const {

    data: { user },

    error: userError

  } =

    await supabaseClient
      .auth
      .getUser();


  if (
    userError ||
    !user
  ) {

    message.innerText =
      "Oturumunuz bulunamadı. Lütfen tekrar giriş yapın.";

    return;

  }


  if (!selectedAddressId) {
    message.innerText = "Lütfen teslimat adresi seçin.";
    return;
  }

  const { data: selectedAddress, error: addressError } = await supabaseClient
    .from("customer_addresses")
    .select("id,title,neighborhood,address")
    .eq("id", selectedAddressId)
    .eq("user_id", user.id)
    .single();

  if (addressError || !selectedAddress) {
    message.innerText = "Teslimat adresi bulunamadı. Lütfen profilinizden adresinizi kontrol edin.";
    return;
  }

  const neighborhood = selectedAddress.neighborhood;
  const address = selectedAddress.address;


  const customerName =
    (

      (
        user
          .user_metadata
          ?.first_name ||
        ""
      )

      +

      " "

      +

      (
        user
          .user_metadata
          ?.last_name ||
        ""
      )

    ).trim();


  const phone =
    user
      .user_metadata
      ?.phone ||
    "";


  if (!selectedDate) {
    message.innerText =
      "Lütfen teslimat tarihi seçin.";
    return;
  }


  const minimumDate =
    getMinimumOrderDate();


  if (selectedDate < minimumDate) {
    message.innerText =
      new Date().getHours() >= 19
        ? "Saat 19:00 geçtiği için yarın için online sipariş veremezsiniz. Lütfen bir sonraki günü veya daha ileri bir tarihi seçin."
        : "Bugün için online sipariş alamıyoruz. Lütfen yarın veya daha ileri bir tarih seçin.";
    return;
  }


  if (
    cart.length === 0
  ) {

    message.innerText =
      "Sepetiniz boş.";

    return;

  }


  const deliveryDate =
    selectedDate;


  const slotParts =
    slot.split("-");


  const startTime =
    slotParts[0] +
    ":00";


  const endTime =
    slotParts[1] +
    ":00";


  message.innerText =
    "Teslimat saati kontrol ediliyor...";


  // Kontenjan tüm müşteriler için ortaktır. RLS'den bağımsız güvenli RPC ile kontrol edilir.
  const { data: capacityRows, error: countError } = await supabaseClient
    .rpc("get_delivery_slot_availability", { p_slot_date: deliveryDate });

  if (countError) {
    message.innerText =
      "Teslimat kapasitesi kontrolünde hata oluştu: " + countError.message;
    return;
  }

  const selectedCapacity = (capacityRows || []).find(
    row => row.delivery_slot === slot
  );

  // Slot henüz delivery_slots tablosunda oluşmadıysa hiç sipariş yoktur:
  // yeni saat diliminin tamamı (6 kontenjan) boş kabul edilir.
  const selectedRemaining = selectedCapacity
    ? Number(selectedCapacity.remaining)
    : 6;

  if (selectedRemaining <= 0) {
    message.innerText =
      "Bu teslimat saati dolmuştur. Lütfen farklı bir saat dilimi seçerek siparişinize devam edin.";
    await loadSlotAvailability();
    return;
  }

  // delivery_slots tablosuna müşteriden doğrudan INSERT yapmıyoruz.
  // RLS güvenliği korunurken Supabase'deki güvenli RPC fonksiyonu
  // seçilen tarih + saat kaydını bulur veya kapasitesi 6 olacak şekilde oluşturur.
  const { data: slotRpcData, error: slotRpcError } = await supabaseClient
    .rpc("get_or_create_delivery_slot", {
      p_slot_date: deliveryDate,
      p_start_time: startTime,
      p_end_time: endTime
    });

  if (slotRpcError) {
    message.innerText =
      "Teslimat saati hazırlanamadı: " + slotRpcError.message;
    return;
  }

  const deliverySlot = Array.isArray(slotRpcData)
    ? slotRpcData[0]
    : slotRpcData;

  if (!deliverySlot || !deliverySlot.id) {
    message.innerText =
      "Teslimat saati hazırlanamadı. Lütfen farklı bir saat seçip tekrar deneyin.";
    return;
  }


  let total = 0;

  let totalQuantity = 0;


  cart.forEach(
    item => {


      total +=

        item.price *
        item.quantity;


      totalQuantity +=
        item.quantity;


    }
  );


  const productSummary =

    cart

      .map(

        item =>

          `${item.name} x${item.quantity}`

      )

      .join(
        " + "
      );


  message.innerText =
    "Sipariş oluşturuluyor...";


  const stockQuantities = getStockQuantitiesFromCart();

  if (stockQuantities.bread || stockQuantities.cream || stockQuantities.salami || stockQuantities.chicken) {
    message.innerText = "Ürün kontenjanları kontrol ediliyor...";

    const { error: stockError } = await supabaseClient.rpc(
      "reserve_daily_product_stock",
      {
        p_stock_date: deliveryDate,
        p_bread: stockQuantities.bread,
        p_cream: stockQuantities.cream,
        p_salami: stockQuantities.salami,
        p_chicken: stockQuantities.chicken
      }
    );

    if (stockError) {
      message.innerText = "Ürün kontenjanı yetersiz: " + stockError.message;
      await loadDailyProductStock();
      return;
    }
  }

  const { error } =

    await supabaseClient

      .from(
        "orders"
      )

      .insert([

        {

          user_id:
            user.id,

          product_name:
            productSummary,

          quantity:
            totalQuantity,

          total:
            total,

          total_amount:
            total,

          delivery_date:
            deliveryDate,

          delivery_slot:
            slot,

          delivery_slot_id:
            deliverySlot.id,

          neighborhood:
            neighborhood,

          address:
            address,

          address_id:
            selectedAddress.id,

          customer_name:
            customerName,

          phone:
            phone,

          order_note:
            orderNote || null,

          status:
            "new"

        }

      ]);


  if (error) {

    // Sipariş kaydı oluşmadıysa ayrılan yan ürün stoklarını geri bırak.
    if (stockQuantities.bread || stockQuantities.cream || stockQuantities.salami || stockQuantities.chicken) {
      await supabaseClient.rpc("release_daily_product_stock", {
        p_stock_date: deliveryDate,
        p_bread: stockQuantities.bread,
        p_cream: stockQuantities.cream,
        p_salami: stockQuantities.salami,
        p_chicken: stockQuantities.chicken
      });
    }

    message.innerText =
      "Sipariş oluşturulamadı: " +
      error.message;

    return;

  }


  cart = [];
  saveCart();
  await loadSlotAvailability();


  document
    .getElementById("home")
    .innerHTML = `
      <div class="success-card">
        <div class="success-icon">✓</div>
        <div class="success-kicker">SİPARİŞ TAMAM</div>
        <h2 class="success-title">Siparişiniz oluşturuldu!</h2>

        <div class="payment-notice">
          <strong>Lütfen dikkat:</strong> Henüz yalnızca nakit ödeme alabiliyoruz.<br>
          Kart ile ödeme alabildiğimizde sizi bilgilendireceğiz.<br><br>
          <strong>Sabah görüşmek üzere! ☀️</strong>
        </div>

        <div class="order-summary">
          <p><strong>Teslimat günü:</strong> ${deliveryDate}</p>
          <p><strong>Teslimat saati:</strong> ${slot}</p>
          <p><strong>Adres:</strong> ${escapeHtml(selectedAddress.title)} · ${escapeHtml(neighborhood)} · ${escapeHtml(address)}</p>
          <p><strong>Sipariş:</strong> ${productSummary}</p>
          ${orderNote ? `<p><strong>Sipariş notu:</strong> ${escapeHtml(orderNote)}</p>` : ``}
          <p><strong>Toplam:</strong> ${total.toLocaleString("tr-TR")} TL</p>
          <p><strong>Ödeme:</strong> Nakit / kapıda ödeme</p>
        </div>
      </div>

      <button onclick="showHome()">Ana Sayfa</button>

    `;

}

async function loadAdminProductStock() {
  const dateEl = document.getElementById("adminStockDate");
  const box = document.getElementById("adminProductStock");
  const message = document.getElementById("adminStockMessage");

  if (!dateEl || !box || !dateEl.value) return;

  if (message) message.textContent = "";
  box.innerHTML = "Kontenjanlar yükleniyor...";

  const { data, error } = await supabaseClient.rpc("get_daily_product_stock", {
    p_stock_date: dateEl.value
  });

  if (error) {
    box.innerHTML = "Kontenjanlar yüklenemedi.";
    if (message) {
      message.style.color = "#a33";
      message.textContent = error.message || "Bir hata oluştu.";
    }
    return;
  }

  const labels = {
    bread: "Tam Buğday Ekmeği",
    cream: "Ev Yapımı Kaymak",
    salami: "Ev Yapımı Salam",
    chicken: "Ev Yapımı Tavuk Ezmesi"
  };

  box.innerHTML = (data || []).map(row => {
    const capacity = Number(row.capacity || 0);
    const sold = Number(row.sold || 0);
    const remaining = Number(row.remaining || 0);
    const code = escapeHtml(row.product_code);
    const label = escapeHtml(labels[row.product_code] || row.product_name);

    return `
      <div style="
        padding:11px 0;
        border-bottom:1px solid #eee7da;
      ">
        <div style="font-weight:800;margin-bottom:7px;">${label}</div>

        <div style="font-size:12px;color:#666;margin-bottom:8px;">
          Satıldı: <strong>${sold}</strong> &nbsp;|&nbsp;
          Kalan: <strong>${remaining}</strong>
        </div>

        <div style="display:flex;gap:8px;align-items:center;">
          <button
            type="button"
            onclick="changeAdminProductCapacity('${code}', ${capacity - 1})"
            style="width:42px;padding:8px;"
            ${capacity <= sold ? "disabled" : ""}
          >−</button>

          <div style="
            min-width:72px;
            text-align:center;
            font-weight:800;
          ">
            Toplam ${capacity}
          </div>

          <button
            type="button"
            onclick="changeAdminProductCapacity('${code}', ${capacity + 1})"
            style="width:42px;padding:8px;"
          >+</button>
        </div>
      </div>
    `;
  }).join("");
}


async function changeAdminProductCapacity(productCode, newCapacity) {
  const dateEl = document.getElementById("adminStockDate");
  const message = document.getElementById("adminStockMessage");

  if (!dateEl || !dateEl.value) return;

  if (message) {
    message.style.color = "#666";
    message.textContent = "Güncelleniyor...";
  }

  const { error } = await supabaseClient.rpc("admin_set_daily_product_capacity", {
    p_stock_date: dateEl.value,
    p_product_code: productCode,
    p_capacity: newCapacity
  });

  if (error) {
    if (message) {
      message.style.color = "#a33";
      message.textContent = error.message || "Kontenjan güncellenemedi.";
    }
    return;
  }

  if (message) {
    message.style.color = "#3f6b45";
    message.textContent = "Kontenjan güncellendi.";
  }

  await loadAdminProductStock();
}


/* =====================================================
   HTML GÜVENLİK
===================================================== */

function escapeHtml(
  value
) {

  if (

    value === null ||

    value === undefined

  ) {

    return "-";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

===================================================== */

async function downloadDailyDeliveryPdf() {
  const dateEl = document.getElementById("adminReportDate");
  const message = document.getElementById("adminReportMessage");

  if (!dateEl || !dateEl.value) {
    if (message) message.textContent = "Lütfen tarih seçin.";
    return;
  }

  if (message) {
    message.style.color = "#666";
    message.textContent = "PDF hazırlanıyor...";
  }

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user || user.user_metadata?.role !== "admin") {
    if (message) {
      message.style.color = "#a33";
      message.textContent = "Yönetici yetkisi gerekiyor.";
    }
    return;
  }

  const { data: orders, error } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("delivery_date", dateEl.value)
    .order("delivery_slot", { ascending: true })
    .order("created_at", { ascending: true });

  if (error) {
    if (message) {
      message.style.color = "#a33";
      message.textContent = "Siparişler alınamadı: " + error.message;
    }
    return;
  }

  const activeOrders = (orders || []).filter(order => {
    const status = String(order.status || "").toLowerCase();
    return status !== "cancelled" && status !== "canceled";
  });

  if (!activeOrders.length) {
    if (message) {
      message.style.color = "#a33";
      message.textContent = "Bu tarihte sipariş bulunmuyor.";
    }
    return;
  }

  if (!window.pdfMake) {
    if (message) {
      message.style.color = "#a33";
      message.textContent = "PDF modülü yüklenemedi. İnternet bağlantısını kontrol edin.";
    }
    return;
  }

  const parseProducts = (value) =>
    String(value || "")
      .split(" + ")
      .map(x => x.trim())
      .filter(Boolean)
      .map(part => {
        const match = part.match(/^(.*?)\s+x(\d+)$/i);
        return {
          name: (match ? match[1] : part).trim(),
          qty: match ? Number(match[2]) : 1
        };
      });

  const formatProducts = (value) =>
    parseProducts(value)
      .map(item => `${item.name} x${item.qty}`)
      .join(", ") || "-";

  const slotOrder = [
    "07:00-08:00",
    "08:00-09:00",
    "09:00-10:00",
    "10:00-11:00",
    "11:00-12:00"
  ];

  const grouped = {};
  slotOrder.forEach(slot => grouped[slot] = []);

  activeOrders.forEach(order => {
    const slot = order.delivery_slot || "Diğer";
    if (!grouped[slot]) grouped[slot] = [];
    grouped[slot].push(order);
  });

  const [year, month, day] = dateEl.value.split("-");
  const displayDate = `${day}.${month}.${year}`;

  const dailyTotals = {};

  activeOrders.forEach(order => {
    parseProducts(order.product_name).forEach(item => {
      dailyTotals[item.name] = (dailyTotals[item.name] || 0) + item.qty;
    });
  });

  const content = [
    {
      text: `STARTWITH — ${displayDate} TESLİMAT VE ÜRETİM PLANI`,
      bold: true,
      fontSize: 16,
      margin: [0, 0, 0, 5]
    },
    {
      text: `Toplam sipariş: ${activeOrders.length}`,
      fontSize: 9,
      margin: [0, 0, 0, 8]
    },
    {
      text: "TOPLAM ÜRETİM ÖZETİ",
      bold: true,
      fontSize: 11,
      margin: [0, 0, 0, 3]
    },
    ...Object.entries(dailyTotals).map(([name, qty]) => ({
      text: `• ${name}: ${qty}`,
      fontSize: 9,
      margin: [8, 1, 0, 1]
    }))
  ];

  const allSlots = [
    ...slotOrder,
    ...Object.keys(grouped).filter(slot => !slotOrder.includes(slot))
  ];

  allSlots.forEach(slot => {
    const slotOrders = grouped[slot] || [];
    if (!slotOrders.length) return;

    content.push({
      text: `${slot} TESLİMATLARI`,
      bold: true,
      fontSize: 12,
      margin: [0, 10, 0, 5]
    });

    const body = [[
      { text: "İsim Soyisim", bold: true },
      { text: "Telefon", bold: true },
      { text: "Adres", bold: true },
      { text: "Sipariş", bold: true },
      { text: "Not", bold: true }
    ]];

    slotOrders.forEach(order => {
      body.push([
        order.customer_name || "-",
        order.phone || "-",
        [order.neighborhood, order.address].filter(Boolean).join(" / ") || "-",
        formatProducts(order.product_name),
        order.order_note || "-"
      ]);
    });

    content.push({
      table: {
        headerRows: 1,
        widths: [90, 78, 180, 220, 90],
        body
      },
      layout: "lightHorizontalLines"
    });

    const totals = {};
    slotOrders.forEach(order => {
      parseProducts(order.product_name).forEach(item => {
        totals[item.name] = (totals[item.name] || 0) + item.qty;
      });
    });

    content.push({
      text: `${slot} ÜRETİM / HAZIRLIK ÖZETİ`,
      bold: true,
      fontSize: 10,
      margin: [0, 7, 0, 3]
    });

    Object.entries(totals).forEach(([name, qty]) => {
      content.push({
        text: `• ${name}: ${qty}`,
        fontSize: 9,
        margin: [8, 1, 0, 1]
      });
    });
  });

  const docDefinition = {
    pageOrientation: "landscape",
    pageSize: "A4",
    pageMargins: [24, 22, 24, 22],
    defaultStyle: {
      font: "Roboto",
      fontSize: 8
    },
    content
  };

  const fileName = `Startwith_${dateEl.value}_saatlik_teslimat_uretim.pdf`;

  try {
    window.pdfMake.createPdf(docDefinition).download(fileName);

    if (message) {
      message.style.color = "#3f6b45";
      message.textContent = "Saatlik teslimat ve üretim PDF'i indiriliyor.";
    }
  } catch (downloadError) {
    console.error(downloadError);

    if (message) {
      message.style.color = "#a33";
      message.textContent = "PDF indirilemedi.";
    }
  }
}

/* =====================================================
   TARİH
===================================================== */

function formatDateTurkish(
  dateString
) {

  if (!dateString) {

    return "Tarih yok";

  }


  const parts =
    dateString.split("-");


  if (
    parts.length !== 3
  ) {

    return dateString;

  }


  const year =
    parts[0];


  const month =
    parts[1];


  const day =
    parts[2];


  const monthNames = [

    "",

    "Ocak",

    "Şubat",

    "Mart",

    "Nisan",

    "Mayıs",

    "Haziran",

    "Temmuz",

    "Ağustos",

    "Eylül",

    "Ekim",

    "Kasım",

    "Aralık"

  ];


  return (

    Number(day)

    +

    " "

    +

    monthNames[
      Number(month)
    ]

    +

    " "

    +

    year

  );

}


/* =====================================================
   DURUM METNİ
===================================================== */

function getStatusText(
  status
) {

  const statuses = {

    new:
      "Yeni Sipariş",

    preparing:
      "Hazırlanıyor",

    ready:
      "Hazır",

    delivered:
      "Teslim Edildi",

    cancelled:
      "İptal"

  };


  return (

    statuses[status] ||

    status ||

    "-"

  );

}

<script id="startwith-full-history">
(() => {
  const screenFunctions = [
    "showAddressForm",
    "showAdminPanel",
    "showCart",
    "showForgotPassword",
    "showHome",
    "showLogin",
    "showMenu",
    "showNewPasswordForm",
    "showOrderForm",
    "showOrders",
    "showProductDetail",
    "showProfile",
    "showRegister"
  ];

  let navigatingFromHistory = false;
  let currentEntry = null;
  const entries = new Map();
  let seq = 0;

  function cloneArgs(args) {
    try { return JSON.parse(JSON.stringify(args)); }
    catch (_) { return []; }
  }

  function install() {
    screenFunctions.forEach(name => {
      const original = window[name];
      if (typeof original !== "function" || original.__startwithHistoryWrapped) return;

      const wrapped = function(...args) {
        const result = original.apply(this, args);

        if (!navigatingFromHistory) {
          const id = ++seq;
          const entry = { id, fn: name, args: cloneArgs(args) };
          entries.set(id, entry);
          currentEntry = entry;
          history.pushState({ startwith: true, id }, "", location.href);
        }
        return result;
      };

      wrapped.__startwithHistoryWrapped = true;
      wrapped.__original = original;
      window[name] = wrapped;
    });
  }

  // Base state = page as first opened.
  history.replaceState({ startwith: true, id: 0 }, "", location.href);

  window.addEventListener("popstate", (event) => {
    const id = event.state && event.state.startwith ? event.state.id : 0;
    const entry = entries.get(id);

    navigatingFromHistory = true;
    try {
      if (entry && typeof window[entry.fn] === "function") {
        window[entry.fn](...(entry.args || []));
        currentEntry = entry;
      } else {
        // Going back to the app's initial/main screen.
        const home = window.showHome;
        if (typeof home === "function") home();
        currentEntry = null;
      }
    } finally {
      setTimeout(() => { navigatingFromHistory = false; }, 0);
    }
  });

  install();
  window.addEventListener("DOMContentLoaded", install);
  window.addEventListener("load", install);
  setTimeout(install, 100);
  setTimeout(install, 500);
})();
</script>
