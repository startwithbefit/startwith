
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startwith</title>

  <style>
    * { box-sizing: border-box; }
    :root {
      --forest:#174d2b; --green:#2f7d32; --leaf:#6fa84f; --sage:#dce7c8;
      --cream:#fbf7ec; --beige:#efe4cf; --brown:#a9825a; --yellow:#f5bf2f;
      --text:#173522; --muted:#6f756c; --white:#fffdf8;
    }
    html,body { min-height:100%; }
    body {
      margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--text);
      background:linear-gradient(160deg,#fffaf0 0%,#f4eddd 55%,#e8efd9 100%);
    }
    body::before, body::after {
      content:""; position:fixed; border-radius:50%; filter:blur(2px); z-index:-1; opacity:.55;
    }
    body::before { width:220px;height:220px;background:#dfe9c9;right:-90px;top:-70px; }
    body::after { width:180px;height:180px;background:#f7d978;left:-90px;bottom:-80px;opacity:.28; }
    .container { max-width:480px; min-height:100dvh; margin:auto; padding:38px 20px 28px; }
    .brand { text-align:center; margin:4px auto 28px; }
    .brand-icon { position:relative; width:92px; height:54px; margin:0 auto 6px; }
    .brand-sun { position:absolute; width:48px;height:25px;border-radius:48px 48px 0 0;background:var(--yellow);left:18px;top:16px; }
    .brand-line { position:absolute;width:86px;height:16px;border-top:5px solid var(--forest);border-radius:50%;left:2px;top:37px;transform:rotate(2deg); }
    .brand-leaf { position:absolute;width:27px;height:14px;background:var(--green);border-radius:100% 0 100% 0;right:2px;top:25px;transform:rotate(-18deg); }
    .brand-name { margin:0; color:var(--forest); font-size:42px; line-height:.95; font-weight:800; letter-spacing:-2px; }
    .brand-fit { margin-top:8px; color:var(--green); font-size:16px; font-weight:800; letter-spacing:7px; }
    .subtitle { text-align:center;color:var(--muted);margin:0 auto 26px;font-size:15px;line-height:1.5; }
    h1 { text-align:center;margin:0; }
    h2 { color:var(--forest); margin:0 0 8px; font-size:27px; }
    #home, .form { background:rgba(255,253,248,.86); border:1px solid rgba(23,77,43,.08); border-radius:28px; padding:22px; box-shadow:0 18px 45px rgba(73,61,40,.10); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    #home:empty { display:none; }
    button { width:100%;padding:15px 18px;border:none;border-radius:16px;background:var(--forest);color:white;font-size:16px;font-weight:700;margin-top:11px;cursor:pointer;box-shadow:0 8px 20px rgba(23,77,43,.14);transition:transform .15s ease,opacity .15s ease; }
    button:active { transform:scale(.985); }
    .secondary { background:#fffaf0;color:var(--forest);border:1.5px solid #b9c9aa;box-shadow:none; }
    .form { display:none; margin-top:0; }
    .form h2 { text-align:center; }
    .form::before { content:""; display:block; width:42px; height:5px; border-radius:99px; background:var(--yellow); margin:0 auto 20px; }
    input,select { width:100%;padding:15px 14px;margin-top:11px;border:1px solid #d9d5c8;border-radius:15px;font-size:15px;color:var(--text);background:#fffdf8;outline:none; }
    input:focus,select:focus { border-color:var(--leaf); box-shadow:0 0 0 3px rgba(111,168,79,.12); }
    .back { background:#eee5d5;color:var(--forest);box-shadow:none; }
    #registerMessage,#loginMessage { text-align:center;margin:15px 0 0;color:var(--green);font-size:14px;line-height:1.45; }
    @media (max-width:380px) { .container{padding:28px 15px 22px}.brand-name{font-size:36px} #home,.form{padding:18px} }

    /* STARTWITH MENÜ TASARIMI */
    .menu-view { margin:-22px; padding:20px; }
    .menu-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .menu-top-copy { min-width:0; }
    .menu-kicker { color:var(--green); font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; }
    .menu-title { margin:0; color:var(--forest); font-size:28px; line-height:1.05; }
    .menu-cart { width:auto; min-width:54px; height:48px; margin:0; padding:0 13px; border-radius:16px; background:#fff8df; color:var(--forest); border:1px solid #eadba5; box-shadow:none; display:flex; align-items:center; justify-content:center; gap:6px; }
    .menu-cart-icon { font-size:20px; line-height:1; }
    .menu-cart-count { min-width:20px; height:20px; padding:0 5px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; background:var(--yellow); color:#49370a; font-size:11px; font-weight:800; }
    .menu-note { margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.5; }
    .menu-section-label { display:flex; align-items:center; gap:9px; margin:18px 0 9px; color:var(--forest); font-size:14px; font-weight:800; }
    .menu-section-label::before { content:''; width:24px; height:5px; border-radius:99px; background:var(--yellow); }
    .product-card { background:#fffdf8; border:1px solid #e8e1d2; border-radius:20px; padding:16px; margin-top:11px; box-shadow:0 8px 22px rgba(71,61,41,.06); }
    .product-row { display:flex; align-items:flex-start; gap:13px; }
    .product-copy { flex:1; min-width:0; }
    .product-name { display:block; color:var(--forest); font-size:17px; line-height:1.25; }
    .product-description { margin-top:7px; color:#687067; font-size:13px; line-height:1.5; }
    .product-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:13px; }
    .product-price { color:var(--green); font-size:18px; font-weight:800; }
    .product-add { width:auto; min-width:86px; margin:0; padding:10px 14px; border-radius:14px; background:var(--yellow); color:#3f330e; box-shadow:none; font-size:14px; }
    .menu-actions { margin-top:20px; padding-top:7px; }
    @media (max-width:380px) { .menu-view{margin:-18px;padding:17px}.product-card{padding:14px}.product-description{font-size:12.5px}.product-add{min-width:76px;padding:9px 11px} }


    /* Ürün detay + sepet + sipariş başarı ekranı */
    .detail-card,.cart-card,.success-card{background:rgba(255,253,248,.94);border:1px solid rgba(47,125,50,.14);border-radius:24px;padding:18px;box-shadow:0 12px 30px rgba(23,77,43,.08);margin-top:14px}
    .detail-kicker,.cart-kicker,.success-kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--green);text-transform:uppercase}
    .detail-title,.cart-title,.success-title{margin:7px 0 8px;color:var(--forest);font-size:27px;line-height:1.12}
    .detail-desc{line-height:1.65;color:var(--muted);margin:10px 0 16px}
    .detail-price-row,.cart-total-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid rgba(23,77,43,.10)}
    .detail-price,.cart-total{font-size:22px;font-weight:850;color:var(--green)}
    .detail-select{margin-top:8px;background:var(--cream);border:1px solid rgba(47,125,50,.22);border-radius:14px;padding:13px 14px;color:var(--text)}
    .detail-add{background:var(--yellow)!important;color:var(--forest)!important;box-shadow:none!important}
    .cart-item{background:rgba(255,253,248,.96);border:1px solid rgba(47,125,50,.13);border-radius:20px;padding:15px;margin-top:10px;box-shadow:0 8px 22px rgba(23,77,43,.06)}
    .cart-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .cart-item-name{font-weight:800;color:var(--forest);line-height:1.3}
    .cart-item-price{font-weight:850;color:var(--green);white-space:nowrap}
    .cart-unit{font-size:13px;color:var(--muted);margin-top:5px}
    .qty-row{display:flex;align-items:center;justify-content:flex-start;gap:12px;margin-top:14px}
    .qty-btn{width:40px!important;height:40px!important;margin:0!important;padding:0!important;border-radius:50%!important;background:var(--sage)!important;color:var(--forest)!important;box-shadow:none!important;font-size:21px!important}
    .qty-number{min-width:24px;text-align:center;font-size:17px;color:var(--forest)}
    .remove-btn{width:auto!important;margin:0 0 0 auto!important;padding:9px 12px!important;background:transparent!important;color:#9b5b4b!important;border:1px solid rgba(155,91,75,.22)!important;box-shadow:none!important;font-size:12px!important}
    .cart-empty{text-align:center;color:var(--muted);padding:28px 8px}
    .checkout-btn{background:var(--yellow)!important;color:var(--forest)!important;box-shadow:none!important;font-weight:850!important}
    .success-icon{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--sage);font-size:34px}
    .success-card{text-align:center}
    .payment-notice{text-align:left;background:var(--beige);border-left:4px solid var(--yellow);border-radius:16px;padding:15px;margin:16px 0;color:var(--text);line-height:1.55}
    .order-summary{text-align:left;background:var(--cream);border-radius:18px;padding:14px 16px;margin-top:14px}
    .order-summary p{margin:9px 0;color:var(--text);line-height:1.45}
  </style>
</head>

<body>

<div class="container">

  <div class="brand" aria-label="Startwith be fit">
    <div class="brand-icon">
      <span class="brand-sun"></span>
      <span class="brand-line"></span>
      <span class="brand-leaf"></span>
    </div>
    <h1 class="brand-name">Startwith</h1>
    <div class="brand-fit">BE FIT</div>
  </div>
  <div class="subtitle">Güne iyi başla. Sağlıklı kahvaltın kapında.</div>

  <div id="home">
    <button onclick="showLogin()">Giriş Yap</button>
  </div>

  <div id="registerForm" class="form">

    <h2>Üye Ol</h2>

    <input id="firstName" type="text" placeholder="Ad">
    <input id="lastName" type="text" placeholder="Soyad">
    <input id="phone" type="tel" placeholder="Telefon">
    <input id="email" type="email" placeholder="E-posta">

    <select id="neighborhood">
      <option value="">Mahalle seçin</option>
      <option value="Batıkent Mahallesi">Batıkent Mahallesi</option>
      <option value="Çamlıca Mahallesi">Çamlıca Mahallesi</option>
    </select>

    <input id="address" type="text" placeholder="Adres">
    <input id="password" type="password" placeholder="Şifre">

    <button onclick="register()">Kayıt Ol</button>
    <button class="back" onclick="goHome()">Geri</button>

    <p id="registerMessage"></p>
  </div>

  <div id="loginForm" class="form">

    <h2>Giriş Yap</h2>

    <input id="loginEmail" type="email" placeholder="E-posta">
    <input id="loginPassword" type="password" placeholder="Şifre">

    <label style="display:flex;align-items:center;gap:9px;margin:10px 0 16px;cursor:pointer;font-size:14px;color:#596158;">
      <input id="rememberMe" type="checkbox" style="width:auto;margin:0;accent-color:#6f8f63;">
      <span>Beni Hatırla</span>
    </label>

    <button onclick="login()">Giriş Yap</button>
    <button class="secondary" onclick="showForgotPassword()">Şifremi Unuttum</button>
    <button class="secondary" onclick="showRegister()">Üye Ol</button>
    <button class="back" onclick="goHome()">Geri</button>

    <p id="loginMessage"></p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jwwfwlddmordfudorrla.supabase.co";
const SUPABASE_KEY = "sb_publishable_-6qXohZul38YL1S4DyfiPA_cg7iHPgO";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let cart = [];
let introVideoIndex = 0;


/* =====================================================
   START WITH - VIDEO AÇILIŞ EKRANI
===================================================== */

function createStartwithIntro() {

  if (document.getElementById("startwithIntro")) {
    return;
  }

  const style = document.createElement("style");

  style.innerHTML = `
    #startwithIntro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      z-index: 999999;
      cursor: pointer;
    }

    #startwithIntro .intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(42%) saturate(70%) contrast(90%);
      transition: opacity 1.2s ease;
    }

    #startwithIntro .intro-video.active {
      opacity: 1;
    }

    #startwithIntro .intro-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.22);
      z-index: 2;
    }

    #startwithIntro .intro-title {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(34px,8vw,72px);
      font-weight: 700;

      letter-spacing: 2px;

      text-align: center;
      text-transform: uppercase;

      text-shadow:
        0 2px 18px rgba(0,0,0,.35);

      user-select: none;
      flex-direction: column;
      line-height: 1.05;
    }

    #startwithIntro .intro-title span {
      display: block;
      white-space: nowrap;
    }

    #startwithIntro .intro-order-button {
      position: absolute;
      left: 50%;
      bottom: max(42px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 4;
      width: min(82vw, 320px);
      padding: 15px 24px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      background: rgba(0,0,0,.30);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #startwithIntro.fade-out {
      opacity: 0;
      transition: opacity .55s ease;
      pointer-events: none;
    }
  `;

  document.head.appendChild(style);


  const intro =
    document.createElement("div");

  intro.id = "startwithIntro";


  intro.innerHTML = `

    <video
      class="intro-video active"
      muted
      playsinline
      preload="auto"
    >
      <source
        src="video03.mp4"
        type="video/mp4"
      >
    </video>


    <video
      class="intro-video"
      muted
      playsinline
      preload="auto"
    >
      <source
        src="video02.mp4"
        type="video/mp4"
      >
    </video>


    <video
      class="intro-video"
      muted
      playsinline
      preload="auto"
    >
      <source
        src="video01.mp4"
        type="video/mp4"
      >
    </video>


    <div class="intro-overlay"></div>


    <div class="intro-title">
      <span>START WITH.</span>
      <span>BE FIT.</span>
    </div>

    <button class="intro-order-button" type="button">SİPARİŞ VER</button>

  `;


  document.body.appendChild(intro);


  const videos =
    intro.querySelectorAll(
      ".intro-video"
    );


  function playIntroVideo(index) {

    videos.forEach(
      (video, i) => {

        if (i === index) {

          video.classList.add(
            "active"
          );

          try {
            video.currentTime = 0;
          } catch (e) {}

          video
            .play()
            .catch(() => {});

        } else {

          video.classList.remove(
            "active"
          );

          video.pause();

          try {
            video.currentTime = 0;
          } catch (e) {}

        }

      }
    );

  }


  videos.forEach(
    (video, index) => {

      video.addEventListener(
        "ended",
        () => {

          introVideoIndex =
            (index + 1) %
            videos.length;

          playIntroVideo(
            introVideoIndex
          );

        }
      );

    }
  );


  function closeIntro() {

    intro.classList.add(
      "fade-out"
    );


    videos.forEach(
      video => {
        video.pause();
      }
    );


    setTimeout(
      () => {

        intro.remove();

      },
      600
    );

  }


  const orderButton =
    intro.querySelector(
      ".intro-order-button"
    );

  orderButton.addEventListener(
    "click",
    event => {
      event.stopPropagation();
      closeIntro();
      openStartwithAfterIntro();
    }
  );


  playIntroVideo(0);

}


if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    createStartwithIntro
  );

} else {

  createStartwithIntro();

}


/* =====================================================
   OTURUM / BENİ HATIRLA
===================================================== */

async function openStartwithAfterIntro() {
  const { data } = await supabaseClient.auth.getSession();

  if (data?.session) {
    showHome();
  } else {
    showLogin();
  }
}

function fillRememberedEmail() {
  const emailInput = document.getElementById("loginEmail");
  const rememberInput = document.getElementById("rememberMe");
  if (!emailInput || !rememberInput) return;

  const savedEmail = localStorage.getItem("startwithRememberedEmail");
  if (savedEmail) {
    emailInput.value = savedEmail;
    rememberInput.checked = true;
  }
}

/* =====================================================
   KAYIT / GİRİŞ EKRANLARI
===================================================== */

function showRegister() {

  document
    .getElementById("home")
    .style.display = "none";

  document
    .getElementById("loginForm")
    .style.display = "none";

  document
    .getElementById("registerForm")
    .style.display = "block";
}


function showLogin() {

  document
    .getElementById("home")
    .style.display = "none";

  document
    .getElementById("registerForm")
    .style.display = "none";

  document
    .getElementById("loginForm")
    .style.display = "block";

  fillRememberedEmail();
}


function goHome() {

  document
    .getElementById("home")
    .style.display = "block";

  document
    .getElementById("registerForm")
    .style.display = "none";

  document
    .getElementById("loginForm")
    .style.display = "none";
}


/* =====================================================
   KAYIT
===================================================== */

async function register() {

  const firstName =
    document
      .getElementById("firstName")
      .value
      .trim();

  const lastName =
    document
      .getElementById("lastName")
      .value
      .trim();

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const neighborhood =
    document
      .getElementById("neighborhood")
      .value
      .trim();

  const address =
    document
      .getElementById("address")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document.getElementById(
      "registerMessage"
    );


  if (
    !firstName ||
    !lastName ||
    !phone ||
    !email ||
    !neighborhood ||
    !address ||
    !password
  ) {

    message.innerText =
      "Lütfen tüm alanları doldurun.";

    return;
  }


  message.innerText =
    "Kayıt yapılıyor...";


  const { error } =
    await supabaseClient
      .auth
      .signUp({

        email: email,

        password: password,

        options: {

          data: {

            first_name: firstName,
            last_name: lastName,
            phone: phone,
            neighborhood: neighborhood,
            address: address

          }

        }

      });


  if (error) {

    message.innerText =
      "Hata: " +
      error.message;

    return;
  }


  message.innerText =
    "Kayıt başarılı! E-posta adresinizi kontrol edin.";

}


/* =====================================================
   ŞİFRE SIFIRLAMA
===================================================== */

function showForgotPassword() {
  const savedEmail = document.getElementById("loginEmail")?.value?.trim() || localStorage.getItem("startwithRememberedEmail") || "";

  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("home").style.display = "block";

  document.getElementById("home").innerHTML = `
    <h2>Şifremi Unuttum</h2>
    <p style="text-align:center;color:#667064;margin-bottom:18px;">
      Üyelikte kullandığınız e-posta adresini girin. Şifre yenileme bağlantısını e-posta adresinize gönderelim.
    </p>
    <input id="resetEmail" type="email" placeholder="E-posta" value="${escapeHtml(savedEmail)}">
    <button onclick="sendPasswordReset()">Şifre Yenileme Bağlantısı Gönder</button>
    <button class="back" onclick="showLogin()">Giriş Ekranına Dön</button>
    <p id="resetMessage" style="text-align:center;"></p>
  `;
}

async function sendPasswordReset() {
  const email = document.getElementById("resetEmail")?.value?.trim();
  const message = document.getElementById("resetMessage");

  if (!email) {
    message.innerText = "Lütfen e-posta adresinizi girin.";
    return;
  }

  message.innerText = "Bağlantı gönderiliyor...";

  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText = "Şifre yenileme bağlantısı gönderildi. Lütfen e-posta kutunuzu kontrol edin.";
}

function showNewPasswordForm() {
  const intro = document.getElementById("startwithIntro");
  if (intro) intro.remove();

  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("home").style.display = "block";

  document.getElementById("home").innerHTML = `
    <h2>Yeni Şifre Oluştur</h2>
    <p style="text-align:center;color:#667064;margin-bottom:18px;">Yeni şifrenizi aşağıya girin.</p>
    <input id="newPassword" type="password" placeholder="Yeni şifre">
    <input id="newPasswordAgain" type="password" placeholder="Yeni şifre tekrar">
    <button onclick="saveNewPassword()">Şifremi Yenile</button>
    <p id="newPasswordMessage" style="text-align:center;"></p>
  `;
}

async function saveNewPassword() {
  const password = document.getElementById("newPassword")?.value || "";
  const passwordAgain = document.getElementById("newPasswordAgain")?.value || "";
  const message = document.getElementById("newPasswordMessage");

  if (password.length < 6) {
    message.innerText = "Şifreniz en az 6 karakter olmalıdır.";
    return;
  }

  if (password !== passwordAgain) {
    message.innerText = "Girdiğiniz şifreler aynı değil.";
    return;
  }

  message.innerText = "Şifreniz yenileniyor...";
  const { error } = await supabaseClient.auth.updateUser({ password });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText = "Şifreniz başarıyla yenilendi. Giriş ekranına yönlendiriliyorsunuz...";
  await supabaseClient.auth.signOut();
  setTimeout(() => showLogin(), 1200);
}

async function ensureInitialAddress(user) {
  const { data: existing, error } = await supabaseClient
    .from("customer_addresses")
    .select("id")
    .eq("user_id", user.id)
    .limit(1);

  if (error || (existing && existing.length > 0)) return;

  const neighborhood = user.user_metadata?.neighborhood;
  const address = user.user_metadata?.address;

  if (neighborhood && address && ["Batıkent", "Çamlıca"].includes(neighborhood)) {
    await supabaseClient.from("customer_addresses").insert([{
      user_id: user.id,
      title: "Ev",
      neighborhood,
      address,
      is_default: true
    }]);
  }
}

async function saveAddress(addressId = null) {
  const message = document.getElementById("addressMessage");
  const title = document.getElementById("addressTitle").value.trim();
  const neighborhood = document.getElementById("addressNeighborhood").value;
  const address = document.getElementById("addressText").value.trim();
  const wantsDefault = document.getElementById("addressDefault").checked;
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user || !title || !neighborhood || !address) {
    message.innerText = "Lütfen tüm adres alanlarını doldurun.";
    return;
  }
  if (!["Batıkent", "Çamlıca"].includes(neighborhood)) {
    message.innerText = "Şimdilik yalnızca Batıkent ve Çamlıca mahallelerine teslimat yapıyoruz.";
    return;
  }

  let makeDefault = wantsDefault;
  if (!addressId) {
    const { count } = await supabaseClient.from("customer_addresses")
      .select("id", { count: "exact", head: true }).eq("user_id", user.id);
    if ((count || 0) === 0) makeDefault = true;
  }

  if (makeDefault) {
    const { error: unsetError } = await supabaseClient.from("customer_addresses")
      .update({ is_default: false }).eq("user_id", user.id);
    if (unsetError) { message.innerText = "Adres kaydedilemedi: " + unsetError.message; return; }
  }

  let result;
  if (addressId) {
    result = await supabaseClient.from("customer_addresses")
      .update({ title, neighborhood, address, is_default: makeDefault })
      .eq("id", addressId).eq("user_id", user.id);
  } else {
    result = await supabaseClient.from("customer_addresses")
      .insert([{ user_id: user.id, title, neighborhood, address, is_default: makeDefault }]);
  }

  if (result.error) { message.innerText = "Adres kaydedilemedi: " + result.error.message; return; }
  await showProfile();
}

async function setDefaultAddress(addressId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  const { error: unsetError } = await supabaseClient.from("customer_addresses")
    .update({ is_default: false }).eq("user_id", user.id);
  if (unsetError) { alert("Adres güncellenemedi: " + unsetError.message); return; }
  const { error } = await supabaseClient.from("customer_addresses")
    .update({ is_default: true }).eq("id", addressId).eq("user_id", user.id);
  if (error) alert("Adres güncellenemedi: " + error.message);
  else showProfile();
}

async function deleteAddress(addressId) {
  if (!confirm("Bu adresi silmek istediğinize emin misiniz?")) return;
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { data: target } = await supabaseClient.from("customer_addresses")
    .select("is_default").eq("id", addressId).eq("user_id", user.id).single();
  const { error } = await supabaseClient.from("customer_addresses")
    .delete().eq("id", addressId).eq("user_id", user.id);
  if (error) { alert("Adres silinemedi: " + error.message); return; }

  if (target?.is_default) {
    const { data: remaining } = await supabaseClient.from("customer_addresses")
      .select("id").eq("user_id", user.id).order("created_at", { ascending: true }).limit(1);
    if (remaining?.[0]) await supabaseClient.from("customer_addresses")
      .update({ is_default: true }).eq("id", remaining[0].id).eq("user_id", user.id);
  }
  showProfile();
}

  if (info) info.innerText = "Siparişiniz seçtiğiniz adrese teslim edilecektir.";
}

function addProductToCart(
  name,
  price
) {

  const quantity =
    Number(

      document
        .getElementById(
          "productQuantity"
        )
        .value

    );


  const existingItem =
    cart.find(

      item =>
        item.name === name

    );


  if (existingItem) {

    existingItem.quantity +=
      quantity;

  } else {

    cart.push({

      name: name,
      price: price,
      quantity: quantity

    });

  }


  showMenu();

}

   SEPET
===================================================== */

function showCart() {
  let total = 0;
  let products = "";

  cart.forEach((item, index) => {
    const itemTotal = item.price * item.quantity;
    total += itemTotal;
    products += `
      <div class="cart-item">
        <div class="cart-item-top">
          <div>
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-unit">${item.price.toLocaleString("tr-TR")} TL / adet</div>
          </div>
          <div class="cart-item-price">${itemTotal.toLocaleString("tr-TR")} TL</div>
        </div>
        <div class="qty-row">
          <button class="qty-btn" onclick="decreaseQuantity(${index})">−</button>
          <strong class="qty-number">${item.quantity}</strong>
          <button class="qty-btn" onclick="increaseQuantity(${index})">+</button>
          <button class="remove-btn" onclick="removeFromCart(${index})">Sil</button>
        </div>
      </div>`;
  });

  if (cart.length === 0) {
    products = `<div class="cart-empty">Sepetiniz henüz boş 🌿</div>`;
  }

  document.getElementById("home").innerHTML = `
    <div class="cart-kicker">STARTWITH · BE FIT</div>
    <h2 class="cart-title">Sepetim</h2>
    ${products}

    <div class="cart-card">
      <div class="cart-total-row" style="border-top:0;padding:0;">
        <strong>Toplam</strong>
        <span class="cart-total">${total.toLocaleString("tr-TR")} TL</span>
      </div>
      ${cart.length > 0 && total >= 200 ? `<button class="checkout-btn" onclick="showOrderForm()">Siparişi Oluştur</button>` : ""}
      ${cart.length > 0 && total < 200 ? `<div style="margin-top:14px;background:#fff7d6;border:1px solid #f1d47a;padding:12px;border-radius:12px;color:#4d442d;line-height:1.45;"><strong>Minimum sepet tutarı 200 TL'dir.</strong><br>Sipariş verebilmek için sepetinize en az ${(200-total).toLocaleString("tr-TR")} TL daha ürün eklemelisiniz.</div>` : ""}
    </div>

    <button class="back" onclick="showMenu()">Menüye Dön</button>
    <button class="back" onclick="showHome()">Ana Sayfa</button>
  `;
}


/* =====================================================
   ADET
===================================================== */

function increaseQuantity(
  index
) {

  cart[index].quantity++;

  showCart();

}


function decreaseQuantity(
  index
) {

  if (
    cart[index].quantity > 1
  ) {

    cart[index].quantity--;

  } else {

    cart.splice(
      index,
      1
    );

  }


  showCart();

}


function removeFromCart(
  index
) {

  cart.splice(
    index,
    1
  );


  showCart();

}

function getTomorrowDate() {

  const tomorrow =
    new Date();


  tomorrow.setDate(

    tomorrow.getDate() + 1

  );


  const year =
    tomorrow.getFullYear();


  const month =
    String(

      tomorrow.getMonth() + 1

    ).padStart(
      2,
      "0"
    );


  const day =
    String(

      tomorrow.getDate()

    ).padStart(
      2,
      "0"
    );


  return (
    `${year}-${month}-${day}`
  );

}



function formatLocalDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function getMinimumOrderDate() {
  const date = new Date();
  // 18:00'dan önce en erken yarın, 18:00 ve sonrasında en erken öbür gün.
  date.setDate(date.getDate() + (date.getHours() >= 18 ? 2 : 1));
  return formatLocalDate(date);
}

const STARTWITH_DELIVERY_SLOTS = [
  "07:00-07:30","07:30-08:00","08:00-08:30","08:30-09:00",
  "09:00-09:30","09:30-10:00","10:00-10:30","10:30-11:00",
  "11:00-11:30","11:30-12:00","12:00-12:30","12:30-13:00",
  "13:00-13:30","13:30-14:00"
];

async function loadSlotAvailability() {
  const dateInput = document.getElementById("deliveryDate");
  const select = document.getElementById("deliverySlot");
  const info = document.getElementById("slotAvailabilityInfo");
  if (!dateInput || !select || !info) return;

  const selectedDate = dateInput.value;
  select.innerHTML = `<option value="">Saatler kontrol ediliyor...</option>`;
  select.disabled = true;

  const { data: availability, error } = await supabaseClient
    .rpc("get_delivery_slot_availability", { p_slot_date: selectedDate });

  if (error) {
    select.innerHTML = `<option value="">Saatler yüklenemedi</option>`;
    info.innerText = "Teslimat saatlerinin doluluk bilgisi alınamadı: " + error.message;
    return;
  }

  const remainingBySlot = {};
  (availability || []).forEach(row => {
    remainingBySlot[row.delivery_slot] = Number(row.remaining);
  });

  let options = `<option value="">Teslimat saati seçin</option>`;
  STARTWITH_DELIVERY_SLOTS.forEach(slot => {
    const remaining = remainingBySlot[slot] ?? 3;
    const full = remaining <= 0;
    const label = full
      ? `${slot.replace("-", " - ")} — DOLU`
      : `${slot.replace("-", " - ")} — ${remaining} kontenjan kaldı`;
    options += `<option value="${slot}" ${full ? "disabled" : ""}>${label}</option>`;
  });

  select.innerHTML = options;
  select.disabled = false;
  info.innerHTML = `Seçtiğiniz tarih için <strong>kalan kontenjan</strong> gösteriliyor. Dolu saatler seçilemez.`;
}

async function createOrder() {

  const slot =
    document
      .getElementById(
        "deliverySlot"
      )
      .value;


  const selectedDate =
    document
      .getElementById(
        "deliveryDate"
      )
      .value;


  const message =
    document
      .getElementById(
        "orderMessage"
      );


  const orderNote = (document.getElementById("orderNote")?.value || "").trim();
  const selectedAddressId = document.getElementById("deliveryAddress")?.value || "";

  const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

  if (cartTotal < 200) {
    message.innerText = "Minimum sepet tutarı 200 TL'dir. Siparişinizi tamamlamak için sepetinize ürün ekleyin.";
    return;
  }

  if (!slot) {

    message.innerText =
      "Lütfen teslimat saati seçin.";

    return;

  }


  const {

    data: { user },

    error: userError

  } =

    await supabaseClient
      .auth
      .getUser();


  if (
    userError ||
    !user
  ) {

    message.innerText =
      "Oturumunuz bulunamadı. Lütfen tekrar giriş yapın.";

    return;

  }


  if (!selectedAddressId) {
    message.innerText = "Lütfen teslimat adresi seçin.";
    return;
  }

  const { data: selectedAddress, error: addressError } = await supabaseClient
    .from("customer_addresses")
    .select("id,title,neighborhood,address")
    .eq("id", selectedAddressId)
    .eq("user_id", user.id)
    .single();

  if (addressError || !selectedAddress) {
    message.innerText = "Teslimat adresi bulunamadı. Lütfen profilinizden adresinizi kontrol edin.";
    return;
  }

  const neighborhood = selectedAddress.neighborhood;
  const address = selectedAddress.address;


  const customerName =
    (

      (
        user
          .user_metadata
          ?.first_name ||
        ""
      )

      +

      " "

      +

      (
        user
          .user_metadata
          ?.last_name ||
        ""
      )

    ).trim();


  const phone =
    user
      .user_metadata
      ?.phone ||
    "";


  if (!selectedDate) {
    message.innerText =
      "Lütfen teslimat tarihi seçin.";
    return;
  }


  const minimumDate =
    getMinimumOrderDate();


  if (selectedDate < minimumDate) {
    message.innerText =
      new Date().getHours() >= 18
        ? "Saat 18:00 geçtiği için yarın için online sipariş veremezsiniz. Lütfen bir sonraki günü veya daha ileri bir tarihi seçin."
        : "Bugün için online sipariş alamıyoruz. Lütfen yarın veya daha ileri bir tarih seçin.";
    return;
  }


  if (
    cart.length === 0
  ) {

    message.innerText =
      "Sepetiniz boş.";

    return;

  }


  const deliveryDate =
    selectedDate;


  const slotParts =
    slot.split("-");


  const startTime =
    slotParts[0] +
    ":00";


  const endTime =
    slotParts[1] +
    ":00";


  message.innerText =
    "Teslimat saati kontrol ediliyor...";


  // Kontenjan tüm müşteriler için ortaktır. RLS'den bağımsız güvenli RPC ile kontrol edilir.
  const { data: capacityRows, error: countError } = await supabaseClient
    .rpc("get_delivery_slot_availability", { p_slot_date: deliveryDate });

  if (countError) {
    message.innerText =
      "Teslimat kapasitesi kontrolünde hata oluştu: " + countError.message;
    return;
  }

  const selectedCapacity = (capacityRows || []).find(
    row => row.delivery_slot === slot
  );

  if (!selectedCapacity || Number(selectedCapacity.remaining) <= 0) {
    message.innerText =
      "Bu teslimat saati dolmuştur. Lütfen farklı bir saat dilimi seçerek siparişinize devam edin.";
    await loadSlotAvailability();
    return;
  }

  // delivery_slots tablosuna müşteriden doğrudan INSERT yapmıyoruz.
  // RLS güvenliği korunurken Supabase'deki güvenli RPC fonksiyonu
  // seçilen tarih + saat kaydını bulur veya kapasitesi 3 olacak şekilde oluşturur.
  const { data: slotRpcData, error: slotRpcError } = await supabaseClient
    .rpc("get_or_create_delivery_slot", {
      p_slot_date: deliveryDate,
      p_start_time: startTime,
      p_end_time: endTime
    });

  if (slotRpcError) {
    message.innerText =
      "Teslimat saati hazırlanamadı: " + slotRpcError.message;
    return;
  }

  const deliverySlot = Array.isArray(slotRpcData)
    ? slotRpcData[0]
    : slotRpcData;

  if (!deliverySlot || !deliverySlot.id) {
    message.innerText =
      "Teslimat saati hazırlanamadı. Lütfen farklı bir saat seçip tekrar deneyin.";
    return;
  }


  let total = 0;

  let totalQuantity = 0;


  cart.forEach(
    item => {


      total +=

        item.price *
        item.quantity;


      totalQuantity +=
        item.quantity;


    }
  );


  const productSummary =

    cart

      .map(

        item =>

          `${item.name} x${item.quantity}`

      )

      .join(
        " + "
      );


  message.innerText =
    "Sipariş oluşturuluyor...";


  const { error } =

    await supabaseClient

      .from(
        "orders"
      )

      .insert([

        {

          user_id:
            user.id,

          product_name:
            productSummary,

          quantity:
            totalQuantity,

          total:
            total,

          total_amount:
            total,

          delivery_date:
            deliveryDate,

          delivery_slot:
            slot,

          delivery_slot_id:
            deliverySlot.id,

          neighborhood:
            neighborhood,

          address:
            address,

          address_id:
            selectedAddress.id,

          customer_name:
            customerName,

          phone:
            phone,

          order_note:
            orderNote || null,

          status:
            "new"

        }

      ]);


  if (error) {

    message.innerText =

      "Sipariş oluşturulamadı: " +

      error.message;


    return;

  }


  cart = [];


  document
    .getElementById("home")
    .innerHTML = `
      <div class="success-card">
        <div class="success-icon">✓</div>
        <div class="success-kicker">SİPARİŞ TAMAM</div>
        <h2 class="success-title">Siparişiniz oluşturuldu!</h2>

        <div class="payment-notice">
          <strong>Lütfen dikkat:</strong> Henüz yalnızca nakit ödeme alabiliyoruz.<br>
          Kart ile ödeme alabildiğimizde sizi bilgilendireceğiz.<br><br>
          <strong>Sabah görüşmek üzere! ☀️</strong>
        </div>

        <div class="order-summary">
          <p><strong>Teslimat günü:</strong> ${deliveryDate}</p>
          <p><strong>Teslimat saati:</strong> ${slot}</p>
          <p><strong>Adres:</strong> ${escapeHtml(selectedAddress.title)} · ${escapeHtml(neighborhood)} · ${escapeHtml(address)}</p>
          <p><strong>Sipariş:</strong> ${productSummary}</p>
          ${orderNote ? `<p><strong>Sipariş notu:</strong> ${escapeHtml(orderNote)}</p>` : ``}
          <p><strong>Toplam:</strong> ${total.toLocaleString("tr-TR")} TL</p>
          <p><strong>Ödeme:</strong> Nakit / kapıda ödeme</p>
        </div>
      </div>

      <button onclick="showHome()">Ana Sayfa</button>

    `;

}

/* =====================================================

===================================================== */

function escapeHtml(
  value
) {

  if (

    value === null ||

    value === undefined

  ) {

    return "-";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

function formatDateTurkish(
  dateString
) {

  if (!dateString) {

    return "Tarih yok";

  }


  const parts =
    dateString.split("-");


  if (
    parts.length !== 3
  ) {

    return dateString;

  }


  const year =
    parts[0];


  const month =
    parts[1];


  const day =
    parts[2];


  const monthNames = [

    "",

    "Ocak",

    "Şubat",

    "Mart",

    "Nisan",

    "Mayıs",

    "Haziran",

    "Temmuz",

    "Ağustos",

    "Eylül",

    "Ekim",

    "Kasım",

    "Aralık"

  ];


  return (

    Number(day)

    +

    " "

    +

    monthNames[
      Number(month)
    ]

    +

    " "

    +

    year

  );

}

}
