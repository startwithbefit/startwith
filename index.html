function increaseQuantity(index) {
  cart[index].quantity++;
  showCart();
}

function decreaseQuantity(index) {

  if (cart[index].quantity > 1) {
    cart[index].quantity--;
  } else {
    cart.splice(index, 1);
  }

  showCart();
}

function removeFromCart(index) {
  cart.splice(index, 1);
  showCart();
}

function getTomorrowDate() {

  const tomorrow = new Date();

  tomorrow.setDate(
    tomorrow.getDate() + 1
  );

  const year = tomorrow.getFullYear();

  const month = String(
    tomorrow.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    tomorrow.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

async function createOrder() {

  const slot =
    document.getElementById("deliverySlot").value;

  const message =
    document.getElementById("orderMessage");

  if (!slot) {
    message.innerText =
      "Lütfen teslimat saati seçin.";
    return;
  }


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    message.innerText =
      "Oturumunuz bulunamadı. Lütfen tekrar giriş yapın.";

    return;
  }


  const neighborhood =
    user.user_metadata?.neighborhood;

  const address =
    user.user_metadata?.address;


  const customerName =
    (
      (user.user_metadata?.first_name || "") +
      " " +
      (user.user_metadata?.last_name || "")
    ).trim();

  const phone =
    user.user_metadata?.phone || "";


  if (!neighborhood || !address) {

    message.innerText =
      "Adres bilgileriniz eksik. Lütfen çıkış yapıp tekrar giriş yapın.";

    return;
  }


  const now = new Date();

  if (now.getHours() >= 18) {

    message.innerText =
      "Bu gün için online sipariş süresi dolmuştur. " +
      "Eğer bu gün sizin için uygunsa, lütfen bizimle " +
      "iletişime geçin; size yardımcı olmaya çalışacağız.";

    return;
  }


  const deliveryDate =
    getTomorrowDate();


  const slotParts =
    slot.split("-");

  const startTime =
    slotParts[0] + ":00";

  const endTime =
    slotParts[1] + ":00";


  message.innerText =
    "Teslimat saati kontrol ediliyor...";


  const {
    data: deliverySlot,
    error: slotError
  } = await supabaseClient
    .from("delivery_slots")
    .select(
      "id, slot_date, start_time, end_time, capacity"
    )
    .eq("slot_date", deliveryDate)
    .eq("start_time", startTime)
    .eq("end_time", endTime)
    .maybeSingle();


  if (slotError) {

    message.innerText =
      "Teslimat saati kontrolünde hata oluştu: " +
      slotError.message;

    return;
  }


  if (!deliverySlot) {

    message.innerText =
      "Seçtiğiniz teslimat saati için uygun bir teslimat kaydı bulunamadı.";

    return;
  }


  const {
    data: orderCount,
    error: countError
  } = await supabaseClient
    .rpc(
      "get_slot_order_count",
      {
        p_delivery_slot_id:
          deliverySlot.id
      }
    );


  if (countError) {

    message.innerText =
      "Teslimat kapasitesi kontrolünde hata oluştu: " +
      countError.message;

    return;
  }


  if (
    orderCount >=
    deliverySlot.capacity
  ) {

    message.innerText =
      "Bu teslimat saati şu anda dolu. " +
      "Lütfen başka bir teslimat saati seçin.";

    return;
  }


  let total = 0;
  let quantity = 0;

  cart.forEach(item => {

    total +=
      item.price *
      item.quantity;

    quantity +=
      item.quantity;

  });


  if (cart.length === 0) {

    message.innerText =
      "Sepetiniz boş.";

    return;
  }


  message.innerText =
    "Sipariş oluşturuluyor...";


  const {
    error
  } = await supabaseClient
    .from("orders")
    .insert([
      {
        user_id: user.id,
        product_name: cart[0].name,
        quantity: quantity,
        total: total,
        total_amount: total,
        delivery_date: deliveryDate,
        delivery_slot: slot,
        delivery_slot_id: deliverySlot.id,
        neighborhood: neighborhood,
        address: address,
        customer_name: customerName,
        phone: phone,
        status: "new"
      }
    ]);


  if (error) {

    message.innerText =
      "Sipariş oluşturulamadı: " +
      error.message;

    return;
  }


  cart = [];


  document.getElementById("home").innerHTML = `

    <h2>🎉 Siparişiniz Alındı!</h2>

    <p style="text-align:center;">
      Siparişiniz başarıyla oluşturuldu.
    </p>

    <div style="
      background:white;
      padding:15px;
      border-radius:10px;
      margin-top:20px;
    ">

      <p>
        <strong>Teslimat günü:</strong>
        ${deliveryDate}
      </p>

      <p>
        <strong>Teslimat saati:</strong>
        ${slot}
      </p>

      <p>
        <strong>Mahalle:</strong>
        ${neighborhood}
      </p>

      <p>
        <strong>Adres:</strong>
        ${address}
      </p>

      <p>
        <strong>Ödeme:</strong>
        Kapıda ödeme
      </p>

      <p>
        <strong>Toplam:</strong>
        ${total} TL
      </p>

    </div>

    <button onclick="showHome()">
      Ana Sayfa
    </button>

  `;
}

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "-";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

   YÖNETİCİ SİPARİŞLERİ
========================= */

async function loadAdminOrders() {

  const container =
    document.getElementById("adminOrders");

  if (!container) {
    return;
  }

  container.innerHTML =
    "<p>Siparişler yükleniyor...</p>";


  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (
    !user ||
    user.user_metadata?.role !== "admin"
  ) {

    container.innerHTML =
      "<p>Yetkiniz bulunmuyor.</p>";

    return;
  }


  const {
    data: orders,
    error
  } = await supabaseClient
    .from("orders")
    .select("*")
    .order("delivery_date", {
      ascending: true
    })
    .order("delivery_slot", {
      ascending: true
    })
    .order("created_at", {
      ascending: true
    });


  if (error) {

    container.innerHTML = `
      <p>
        Siparişler yüklenemedi:
        ${escapeHtml(error.message)}
      </p>
    `;

    return;
  }


  const filter =
    document.getElementById(
      "adminDateFilter"
    )?.value || "tomorrow";


  let filteredOrders =
    orders || [];


  if (filter === "tomorrow") {

    const tomorrow =
      getTomorrowDate();

    filteredOrders =
      filteredOrders.filter(
        order =>

function formatDateTurkish(dateString) {

  if (!dateString) {
    return "Tarih yok";
  }


  const parts =
    dateString.split("-");


  if (parts.length !== 3) {
    return dateString;
  }


  const year =
    parts[0];

  const month =
    parts[1];

  const day =
    parts[2];


  const monthNames = [
    "",
    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"
  ];


  return (
    Number(day) +
    " " +
    monthNames[
      Number(month)
    ] +
    " " +
    year
  );
}

function getStatusText(status) {

  const statuses = {
    new: "Yeni Sipariş",
    preparing: "Hazırlanıyor",
    ready: "Hazır",
    delivered: "Teslim Edildi",
    cancelled: "İptal"
  };

  return statuses[status] || status || "-";
}
