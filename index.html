<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startwith</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f2;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .form {
      display: none;
      margin-top: 25px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .back {
      background: #eee;
      color: #222;
    }

    #registerMessage,
    #loginMessage {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Startwith</h1>
  <div class="subtitle">Sağlıklı kahvaltı kapınızda</div>

  <div id="home">
    <button onclick="showRegister()">Üye Ol</button>
    <button class="secondary" onclick="showLogin()">Giriş Yap</button>
  </div>

  <div id="registerForm" class="form">

    <h2>Üye Ol</h2>

    <input id="firstName" type="text" placeholder="Ad">
    <input id="lastName" type="text" placeholder="Soyad">
    <input id="phone" type="tel" placeholder="Telefon">
    <input id="email" type="email" placeholder="E-posta">

    <select id="neighborhood">
      <option value="">Mahalle seçin</option>
      <option value="Batıkent Mahallesi">Batıkent Mahallesi</option>
      <option value="Çamlıca Mahallesi">Çamlıca Mahallesi</option>
    </select>

    <input id="address" type="text" placeholder="Adres">
    <input id="password" type="password" placeholder="Şifre">

    <button onclick="register()">Kayıt Ol</button>
    <button class="back" onclick="goHome()">Geri</button>

    <p id="registerMessage"></p>
  </div>

  <div id="loginForm" class="form">

    <h2>Giriş Yap</h2>

    <input id="loginEmail" type="email" placeholder="E-posta">
    <input id="loginPassword" type="password" placeholder="Şifre">

    <button onclick="login()">Giriş Yap</button>
    <button class="back" onclick="goHome()">Geri</button>

    <p id="loginMessage"></p>
  </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jwwfwlddmordfudorrla.supabase.co";
const SUPABASE_KEY = "sb_publishable_-6qXohZul38YL1S4DyfiPA_cg7iHPgO";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let cart = [];


/* =========================
   ANA SAYFA / GİRİŞ
========================= */

function showRegister() {
  document.getElementById("home").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("registerForm").style.display = "block";
}

function showLogin() {
  document.getElementById("home").style.display = "none";
  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
}

function goHome() {
  document.getElementById("home").style.display = "block";
  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
}


/* =========================
   KAYIT
========================= */

async function register() {

  const firstName = document.getElementById("firstName").value;
  const lastName = document.getElementById("lastName").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const neighborhood = document.getElementById("neighborhood").value;
  const address = document.getElementById("address").value;
  const password = document.getElementById("password").value;

  const message = document.getElementById("registerMessage");

  if (
    !firstName ||
    !lastName ||
    !phone ||
    !email ||
    !neighborhood ||
    !address ||
    !password
  ) {
    message.innerText = "Lütfen tüm alanları doldurun.";
    return;
  }

  message.innerText = "Kayıt yapılıyor...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        first_name: firstName,
        last_name: lastName,
        phone: phone,
        neighborhood: neighborhood,
        address: address
      }
    }
  });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  message.innerText =
    "Kayıt başarılı! E-posta adresinizi kontrol edin.";
}


/* =========================
   GİRİŞ
========================= */

async function login() {

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const message = document.getElementById("loginMessage");

  message.innerText = "Giriş yapılıyor...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.innerText = "Hata: " + error.message;
    return;
  }

  showHome();
}


/* =========================
   GİRİŞ YAPILMIŞ ANA SAYFA
========================= */

function showHome() {

  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("home").style.display = "block";

  document.getElementById("home").innerHTML = `
    <h2>Hoş geldin!</h2>

    <p>Startwith'e hoş geldin. 🥗</p>

    <button onclick="showMenu()">
      Kahvaltı Menüsü
    </button>

    <button class="secondary" onclick="showCart()">
      Sepetim
    </button>

    <button class="secondary" onclick="showOrders()">
      Siparişlerim
    </button>

    <button class="back" onclick="logout()">
      Çıkış Yap
    </button>
  `;
}


/* =========================
   MENÜ
========================= */

function showMenu() {

  document.getElementById("home").innerHTML = `
    <h2>Kahvaltı Menüsü</h2>

    <div style="
      background:white;
      padding:15px;
      border-radius:10px;
      margin-top:15px;
    ">

      <h3>Startwith Fit Kahvaltı</h3>

      <p>
        Yumurta, peynir, zeytin, yeşillik,
        domates, ekmek
      </p>

      <strong>249 TL</strong>

      <button onclick="addToCart()">
        Sepete Ekle
      </button>

    </div>

    <button class="secondary" onclick="showCart()">
      Sepetim
    </button>

    <button class="back" onclick="showHome()">
      Geri
    </button>
  `;
}


/* =========================
   SEPETE EKLE
========================= */

function addToCart() {

  const existingItem = cart.find(
    item => item.name === "Startwith Fit Kahvaltı"
  );

  if (existingItem) {

    existingItem.quantity++;

  } else {

    cart.push({
      name: "Startwith Fit Kahvaltı",
      price: 249,
      quantity: 1
    });

  }

  showCart();
}


/* =========================
   SEPET
========================= */

function showCart() {

  let total = 0;
  let products = "";

  cart.forEach((item, index) => {

    total += item.price * item.quantity;

    products += `
      <div style="
        background:white;
        padding:15px;
        border-radius:10px;
        margin-top:10px;
      ">

        <strong>${item.name}</strong>

        <p>${item.price} TL / adet</p>

        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          gap:15px;
        ">

          <button
            style="width:50px; margin-top:0;"
            onclick="decreaseQuantity(${index})">
            −
          </button>

          <strong style="font-size:18px;">
            ${item.quantity}
          </strong>

          <button
            style="width:50px; margin-top:0;"
            onclick="increaseQuantity(${index})">
            +
          </button>

        </div>

        <button onclick="removeFromCart(${index})">
          Ürünü Sil
        </button>

      </div>
    `;
  });

  if (cart.length === 0) {
    products = "<p>Sepetiniz boş.</p>";
  }

  document.getElementById("home").innerHTML = `
    <h2>Sepetim</h2>

    ${products}

    <h3 style="margin-top:20px;">
      Toplam: ${total} TL
    </h3>

    ${
      cart.length > 0
        ? `
          <button onclick="showOrderForm()">
            Siparişi Oluştur
          </button>
        `
        : ""
    }

    <button class="back" onclick="showMenu()">
      Menüye Dön
    </button>

    <button class="back" onclick="showHome()">
      Ana Sayfa
    </button>
  `;
}


/* =========================
   ADET ARTIR / AZALT
========================= */

function increaseQuantity(index) {

  cart[index].quantity++;

  showCart();
}

function decreaseQuantity(index) {

  if (cart[index].quantity > 1) {

    cart[index].quantity--;

  } else {

    cart.splice(index, 1);

  }

  showCart();
}

function removeFromCart(index) {

  cart.splice(index, 1);

  showCart();
}


/* =========================
   TARİH YARDIMCILARI
========================= */

function getTomorrowDate() {

  const tomorrow = new Date();

  tomorrow.setDate(tomorrow.getDate() + 1);

  const year = tomorrow.getFullYear();

  const month = String(
    tomorrow.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    tomorrow.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


/* =========================
   SİPARİŞ EKRANI
========================= */

function showOrderForm() {

  const tomorrow = getTomorrowDate();

  document.getElementById("home").innerHTML = `

    <h2>Sipariş Oluştur</h2>

    <p>
      Teslimat günü: <strong>Yarın</strong>
    </p>

    <label>
      Teslimat Saati
    </label>

    <select id="deliverySlot">

      <option value="">
        Teslimat saati seçin
      </option>

      <option value="07:00-07:30">
        07:00 - 07:30
      </option>

      <option value="07:30-08:00">
        07:30 - 08:00
      </option>

      <option value="08:00-08:30">
        08:00 - 08:30
      </option>

      <option value="08:30-09:00">
        08:30 - 09:00
      </option>

      <option value="09:00-09:30">
        09:00 - 09:30
      </option>

      <option value="09:30-10:00">
        09:30 - 10:00
      </option>

      <option value="10:00-10:30">
        10:00 - 10:30
      </option>

      <option value="10:30-11:00">
        10:30 - 11:00
      </option>

      <option value="11:00-11:30">
        11:00 - 11:30
      </option>

      <option value="11:30-12:00">
        11:30 - 12:00
      </option>

      <option value="12:00-12:30">
        12:00 - 12:30
      </option>

      <option value="12:30-13:00">
        12:30 - 13:00
      </option>

      <option value="13:00-13:30">
        13:00 - 13:30
      </option>

      <option value="13:30-14:00">
        13:30 - 14:00
      </option>

    </select>

    <div style="
      background:white;
      padding:15px;
      border-radius:10px;
      margin-top:20px;
    ">

      <strong>Ödeme</strong>

      <p>
        Kapıda ödeme
      </p>

    </div>

    <button onclick="createOrder()">
      Siparişi Onayla
    </button>

    <button class="back" onclick="showCart()">
      Sepete Dön
    </button>

    <p id="orderMessage"
       style="text-align:center; margin-top:15px;">
    </p>
  `;
}


/* =========================
   SİPARİŞ OLUŞTUR
========================= */

async function createOrder() {

  const slot =
    document.getElementById("deliverySlot").value;

  const message =
    document.getElementById("orderMessage");

  if (!slot) {

    message.innerText =
      "Lütfen teslimat saati seçin.";

    return;
  }

  /*
    18:00'dan sonra ertesi gün siparişi
    online olarak kabul etmiyoruz.
  */

  const now = new Date();

  const currentHour = now.getHours();

  const currentMinute = now.getMinutes();

  if (
    currentHour > 18 ||
    (currentHour === 18 && currentMinute >= 0)
  ) {

    message.innerText =
      "Bu gün için online sipariş süresi dolmuştur. " +
      "Eğer bu gün sizin için uygunsa, lütfen bizimle " +
      "iletişime geçin; size yardımcı olmaya çalışacağız.";

    return;
  }


  message.innerText =
    "Teslimat saati kontrol ediliyor...";


  const deliveryDate = getTomorrowDate();


  /*
    Aynı gün ve aynı saat için mevcut
    siparişleri kontrol ediyoruz.
  */

  const { count, error: countError } =
    await supabaseClient
      .from("orders")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("delivery_date", deliveryDate)
      .eq("delivery_slot", slot);


  if (countError) {

    message.innerText =
      "Sipariş kontrolünde hata oluştu: " +
      countError.message;

    return;
  }


  /*
    Her yarım saat için maksimum 3 sipariş.
  */

  if (count >= 3) {

    message.innerText =
      "Bu teslimat saati şu anda dolu. " +
      "Lütfen başka bir teslimat saati seçin. " +
      "Eğer bu saat sizin için uygunsa, " +
      "bizimle iletişime geçin; size yardımcı " +
      "olmaya çalışacağız.";

    return;
  }


  /*
    Sepet toplamını hesapla.
  */

  let total = 0;

  let quantity = 0;

  cart.forEach(item => {

    total += item.price * item.quantity;

    quantity += item.quantity;

  });


  if (cart.length === 0) {

    message.innerText =
      "Sepetiniz boş.";

    return;
  }


  message.innerText =
    "Sipariş oluşturuluyor...";


  /*
    Siparişi Supabase'e kaydet.
  */

  const { data, error } =
    await supabaseClient
      .from("orders")
      .insert([
        {
          product_name: cart[0].name,
          quantity: quantity,
          total: total,
          delivery_date: deliveryDate,
          delivery_slot: slot,
          status: "new"
        }
      ])
      .select();


  if (error) {

    message.innerText =
      "Sipariş oluşturulamadı: " +
      error.message;

    return;
  }


  /*
    Başarılı sipariş.
  */

  cart = [];


  document.getElementById("home").innerHTML = `

    <h2>🎉 Siparişiniz Alındı!</h2>

    <p style="text-align:center;">
      Siparişiniz başarıyla oluşturuldu.
    </p>

    <div style="
      background:white;
      padding:15px;
      border-radius:10px;
      margin-top:20px;
    ">

      <p>
        <strong>Teslimat günü:</strong>
        ${deliveryDate}
      </p>

      <p>
        <strong>Teslimat saati:</strong>
        ${slot}
      </p>

      <p>
        <strong>Ödeme:</strong>
        Kapıda ödeme
      </p>

      <p>
        <strong>Toplam:</strong>
        ${total} TL
      </p>

    </div>

    <button onclick="showHome()">
      Ana Sayfa
    </button>

  `;
}


/* =========================
   SİPARİŞLERİM
========================= */

async function showOrders() {

  document.getElementById("home").innerHTML = `
    <h2>Siparişlerim</h2>
    <p>Siparişleriniz yükleniyor...</p>
  `;


  const {
    data: orders,
    error
  } = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at", {
      ascending: false
    });


  if (error) {

    document.getElementById("home").innerHTML = `
      <h2>Siparişlerim</h2>

      <p>
        Siparişler yüklenirken hata oluştu:
        ${error.message}
      </p>

      <button class="back" onclick="showHome()">
        Ana Sayfa
      </button>
    `;

    return;
  }


  let orderList = "";


  if (!orders || orders.length === 0) {

    orderList =
      "<p>Henüz siparişiniz bulunmuyor.</p>";

  } else {

    orders.forEach(order => {

      orderList += `

        <div style="
          background:white;
          padding:15px;
          border-radius:10px;
          margin-top:10px;
        ">

          <strong>
            ${order.product_name}
          </strong>

          <p>
            Adet: ${order.quantity}
          </p>

          <p>
            Toplam: ${order.total} TL
          </p>

          <p>
            Teslimat:
            ${order.delivery_date}
          </p>

          <p>
            Saat:
            ${order.delivery_slot}
          </p>

          <p>
            Durum:
            ${order.status}
          </p>

        </div>

      `;

    });
  }


  document.getElementById("home").innerHTML = `

    <h2>Siparişlerim</h2>

    ${orderList}

    <button class="back" onclick="showHome()">
      Ana Sayfa
    </button>

  `;
}


/* =========================
   ÇIKIŞ
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();
}

</script>

</body>
</html>
